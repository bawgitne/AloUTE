<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand aloute-navbar" aria-label="Thanh điều hướng chính">
    <div class="container-fluid d-flex align-items-center justify-content-between px-0">
        <!-- Brand & Campus Identifier (Canonical /feed route) -->
        <div class="d-flex align-items-center gap-1 gap-sm-2">
            <!-- Mobile Primary Navigation Offcanvas Trigger (<= 767px) -->
            <button class="btn btn-sm btn-outline-secondary d-md-none aloute-nav-toggle-btn"
                    type="button"
                    data-bs-toggle="offcanvas"
                    data-bs-target="#mobileNavOffcanvas"
                    aria-controls="mobileNavOffcanvas"
                    aria-label="Mở menu điều hướng">
                <i class="bi bi-list fs-5" aria-hidden="true"></i>
            </button>

            <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/feed}" href="/feed">
                <img th:src="@{/images/logo.png}" src="/images/logo.png" alt="AloUTE" width="30" height="30" class="rounded-2 d-inline-block align-text-top shadow-xs">
                <span class="fs-4 fw-bold aloute-navbar-wordmark">Alo<span class="text-primary">UTE</span></span>
                <span class="badge-brand d-none d-sm-inline-block">Campus</span>
            </a>

            <!-- Navbar Search Form: Integrated with GET /search -->
            <form method="GET" th:action="@{/search}" action="/search" class="d-none d-sm-block aloute-search-box" role="search">
                <span class="bi bi-search aloute-search-icon" aria-hidden="true"></span>
                <input class="form-control aloute-search-input"
                       type="search"
                       name="q"
                       th:value="${q != null ? q : ''}"
                       placeholder="Tìm kiếm cộng đồng, chủ đề, @user..."
                       aria-label="Tìm kiếm nội dung">
            </form>
            <!-- Mobile Search Icon Button (< 576px) -->
            <a th:href="@{/search}" href="/search" class="btn btn-sm btn-link text-secondary text-decoration-none d-inline-flex d-sm-none p-1 aloute-mobile-search-btn" title="Tìm kiếm" aria-label="Tìm kiếm">
                <i class="bi bi-search fs-5" aria-hidden="true"></i>
            </a>
        </div>

        <!-- Right: Actions & User Controls -->
        <div class="d-flex align-items-center gap-1 gap-sm-2">
            <!-- Create Post quick action (Modal trigger with /post/create fallback; suppressed on /feed where quick-composer is primary) -->
            <a th:if="${isFeedPage != true and hideGlobalCreatePost != true and isCommunityDetailPage != true}" th:href="@{/post/create}" href="/post/create" data-page="post-create" data-action="navigate-create-post" class="btn btn-sm btn-primary d-none d-sm-inline-flex align-items-center gap-1">
                <i class="bi bi-pencil-square" aria-hidden="true"></i>
                <span>Tạo bài viết</span>
            </a>
            <a th:if="${isFeedPage != true and hideGlobalCreatePost != true and isCommunityDetailPage != true}" th:href="@{/post/create}" href="/post/create" data-page="post-create" data-action="navigate-create-post" class="btn btn-sm btn-primary d-inline-flex d-sm-none aloute-btn-icon-mobile" aria-label="Tạo bài viết mới">
                <i class="bi bi-pencil-square" aria-hidden="true"></i>
            </a>

            <!-- Quick Navigation Shortcuts (Messages & Notifications) -->
            <div th:if="${currentUser != null}" class="d-flex align-items-center gap-1">
                <a th:href="@{/messages}" href="/messages" class="btn btn-sm btn-link text-secondary text-decoration-none position-relative p-1" title="Tin nhắn" aria-label="Tin nhắn">
                    <i class="bi bi-chat-dots fs-5" aria-hidden="true"></i>
                </a>
                <div class="dropdown aloute-notification-dropdown">
                    <a th:href="@{/notifications}" href="/notifications"
                       role="button"
                       id="navbarNotificationDropdown"
                       data-bs-toggle="dropdown"
                       data-bs-auto-close="outside"
                       aria-expanded="false"
                       class="navbar-notification-link btn btn-sm btn-link text-secondary text-decoration-none position-relative p-1"
                       title="Thông báo"
                       aria-label="Thông báo">
                        <i class="bi bi-bell fs-5" aria-hidden="true"></i>
                        <span id="navbar-notification-badge" class="navbar-notification-badge position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none" data-badge="notification" style="font-size: 0.65rem;">
                            0
                        </span>
                    </a>
                    <div class="dropdown-menu dropdown-menu-end shadow-lg p-0 aloute-notification-preview-menu"
                         id="navbar-notification-preview"
                         aria-labelledby="navbarNotificationDropdown">
                        <div class="d-flex align-items-center justify-content-between px-3 py-2 border-bottom">
                            <span class="fw-bold small text-dark">Thông báo gần đây</span>
                            <button type="button" class="btn btn-link btn-sm p-0 text-decoration-none small text-primary" id="btn-navbar-mark-all-read">
                                Đã đọc tất cả
                            </button>
                        </div>
                        <div id="navbar-notif-feedback" class="alert py-1 px-3 mb-0 small rounded-0 d-none" role="alert"></div>
                        <div class="aloute-notification-preview-list" id="navbar-notification-list" role="region" aria-live="polite">
                            <!-- Populated dynamically via REST GET /api/notifications?page=0&size=5 -->
                        </div>
                        <div class="p-2 border-top text-center bg-light rounded-bottom">
                            <a th:href="@{/notifications}" href="/notifications" class="dropdown-item text-decoration-none small fw-semibold text-primary d-block py-1 text-center" id="navbar-notifications-view-all">
                                Xem tất cả thông báo
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Authenticated User Dropdown -->
            <div th:if="${currentUser != null}" class="dropdown">
                <button class="btn btn-link text-decoration-none p-0 d-flex align-items-center gap-2 aloute-user-dropdown-btn"
                        type="button"
                        id="userNavbarDropdown"
                        data-bs-toggle="dropdown"
                        aria-expanded="false"
                        aria-label="Menu tài khoản">
                    <img th:src="${currentUser.avatarUrl != null and !currentUser.avatarUrl.isEmpty()} ? ${currentUser.avatarUrl} : @{/images/avatar-fallback.svg}"
                         src="/images/avatar-fallback.svg"
                         alt="Avatar người dùng"
                         class="avatar-img avatar-sm"
                         width="32"
                         height="32">
                    <span class="d-none d-md-inline fw-medium small" th:text="${currentUser?.displayName ?: (currentUser?.username ?: 'Sinh viên')}">Quân</span>
                    <i class="bi bi-chevron-down text-muted small aloute-user-dropdown-chevron" aria-hidden="true"></i>
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow-lg" aria-labelledby="userNavbarDropdown">
                    <li class="px-3 py-2 border-bottom border-secondary-subtle">
                        <div class="fw-semibold small" th:text="${currentUser?.displayName ?: (currentUser?.username ?: 'Sinh viên UTE')}">Sinh viên UTE</div>
                        <div class="text-muted small" th:text="'@' + ${currentUser?.username ?: 'sinhvien'}">@user</div>
                    </li>
                    <li>
                        <!-- Canonical feed page: /feed -->
                        <a class="dropdown-item d-flex align-items-center gap-2" th:href="@{/feed}" href="/feed">
                            <i class="bi bi-house-door text-secondary" aria-hidden="true"></i>
                            <span>Bảng tin chính</span>
                        </a>
                    </li>
                    <li>
                        <!-- Canonical user profile: /users/{username} if username available, else /profile -->
                        <a class="dropdown-item d-flex align-items-center gap-2"
                           th:href="${currentUser?.username != null} ? @{/users/{u}(u=${currentUser.username})} : @{/profile}"
                           data-page="user-profile"
                           data-action="navigate-profile">
                            <i class="bi bi-person text-secondary" aria-hidden="true"></i>
                            <span>Hồ sơ cá nhân</span>
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item d-flex align-items-center gap-2" th:href="@{/saved}" href="/saved">
                            <i class="bi bi-bookmark text-secondary" aria-hidden="true"></i>
                            <span>Bài viết đã lưu</span>
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item d-flex align-items-center gap-2" th:href="@{/friends}" href="/friends">
                            <i class="bi bi-person-check text-secondary" aria-hidden="true"></i>
                            <span>Bạn bè & Kết nối</span>
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item d-flex align-items-center gap-2" th:href="@{/settings}" href="/settings">
                            <i class="bi bi-gear text-secondary" aria-hidden="true"></i>
                            <span>Cài đặt</span>
                        </a>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <!-- Presentational logout action pending backend auth integration -->
                        <button type="button" class="dropdown-item text-danger d-flex align-items-center gap-2" data-action="logout">
                            <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
                            <span>Đăng xuất</span>
                        </button>
                    </li>
                </ul>
            </div>

            <!-- Guest Navigation Links (Presentational hooks) -->
            <div th:if="${currentUser == null}" class="d-flex align-items-center gap-2">
                <a href="#" data-page="auth-login" data-action="navigate-login" class="btn btn-sm btn-secondary">Đăng nhập</a>
                <a href="#" data-page="auth-register" data-action="navigate-register" class="btn btn-sm btn-primary">Đăng ký</a>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
