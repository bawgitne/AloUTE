<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<div th:fragment="rightSidebar" class="d-flex flex-column gap-3">
    <!-- Trending Topics Widget -->
    <div class="widget-card">
        <div class="widget-title">
            <i class="fa-solid fa-arrow-trend-up text-primary"></i>
            <span>Chủ đề thịnh hành</span>
        </div>
        <div class="d-flex flex-column gap-1">
            <a th:href="@{/feed(topic='congnghe')}" class="topic-tag-item">
                <div>
                    <div class="fw-bold fs-6">#congnghe</div>
                    <small class="text-muted">1.2K bài viết</small>
                </div>
                <i class="fa-solid fa-chevron-right text-muted small"></i>
            </a>
            <a th:href="@{/feed(topic='laptrinh')}" class="topic-tag-item">
                <div>
                    <div class="fw-bold fs-6">#laptrinh</div>
                    <small class="text-muted">850 bài viết</small>
                </div>
                <i class="fa-solid fa-chevron-right text-muted small"></i>
            </a>
            <a th:href="@{/feed(topic='aloute')}" class="topic-tag-item">
                <div>
                    <div class="fw-bold fs-6">#aloute</div>
                    <small class="text-muted">640 bài viết</small>
                </div>
                <i class="fa-solid fa-chevron-right text-muted small"></i>
            </a>
            <a th:href="@{/feed(topic='sinhvien')}" class="topic-tag-item">
                <div>
                    <div class="fw-bold fs-6">#sinhvien</div>
                    <small class="text-muted">420 bài viết</small>
                </div>
                <i class="fa-solid fa-chevron-right text-muted small"></i>
            </a>
        </div>
    </div>

    <!-- Suggested People to Follow Widget -->
    <div class="widget-card">
        <div class="widget-title">
            <i class="fa-solid fa-user-plus text-primary"></i>
            <span>Gợi ý theo dõi</span>
        </div>
        <div class="d-flex flex-column gap-2">
            <div class="who-to-follow-user">
                <div class="d-flex align-items-center gap-2 overflow-hidden">
                    <img src="https://ui-avatars.com/api/?name=Admin+Aloute&background=6366f1&color=fff" class="user-avatar-round" style="width: 36px; height: 36px;" alt="Avatar">
                    <div class="overflow-hidden">
                        <div class="fw-bold text-truncate small" style="color: var(--aloute-text-primary);">Ban Quản Trị</div>
                        <div class="text-muted small text-truncate">@aloute_team</div>
                    </div>
                </div>
                <button class="btn btn-sm btn-aloute-outline py-1 px-3">Theo dõi</button>
            </div>
            <div class="who-to-follow-user">
                <div class="d-flex align-items-center gap-2 overflow-hidden">
                    <img src="https://ui-avatars.com/api/?name=Dev+Community&background=10b981&color=fff" class="user-avatar-round" style="width: 36px; height: 36px;" alt="Avatar">
                    <div class="overflow-hidden">
                        <div class="fw-bold text-truncate small" style="color: var(--aloute-text-primary);">Hội Lập Trình Viên</div>
                        <div class="text-muted small text-truncate">@dev_vn</div>
                    </div>
                </div>
                <button class="btn btn-sm btn-aloute-outline py-1 px-3">Theo dõi</button>
            </div>
        </div>
    </div>

    <!-- Footer Links -->
    <div class="px-2">
        <div class="d-flex flex-wrap gap-2 text-muted" style="font-size: 0.75rem;">
            <a href="#" class="text-muted">Điều khoản</a> •
            <a href="#" class="text-muted">Chính sách</a> •
            <a href="#" class="text-muted">Hỗ trợ</a> •
            <a href="#" class="text-muted">Giới thiệu</a>
        </div>
        <div class="text-muted mt-2" style="font-size: 0.72rem;">
            © 2026 ALOUTE. Nền tảng mạng xã hội kết nối thế hệ mới.
        </div>
    </div>
</div>
</html>
