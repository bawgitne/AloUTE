<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/default :: layout(
        title='Bạn bè & Kết nối',
        content=~{::#friends-content}
      )}">
<body>
<div id="friends-content">
    <!-- Header Card -->
    <div class="aloute-card p-3 mb-3">
        <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
            <div>
                <h1 class="fs-5 fw-bold mb-1 text-dark d-flex align-items-center gap-2">
                    <i class="bi bi-people-fill text-primary" aria-hidden="true"></i>
                    <span>Bạn bè & Kết nối</span>
                </h1>
                <p class="small text-muted mb-0">Quản lý danh sách người bạn đang theo dõi và người theo dõi bạn.</p>
            </div>
            <a th:href="@{/search(category='people')}" class="btn btn-sm btn-outline-primary rounded-pill">
                <i class="bi bi-person-plus me-1" aria-hidden="true"></i>Tìm bạn mới
            </a>
        </div>

        <!-- Filter Tabs -->
        <nav aria-label="Phân loại kết nối">
            <ul class="nav nav-pills gap-1" role="tablist">
                <li class="nav-item" role="presentation">
                    <a th:href="@{/friends(tab='following')}"
                       class="nav-link rounded-pill px-3 py-1 small"
                       th:classappend="${currentTab == null or currentTab == 'following'} ? 'active' : ''"
                       role="tab">
                        <i class="bi bi-person-check me-1" aria-hidden="true"></i>Đang theo dõi
                    </a>
                </li>
                <li class="nav-item" role="presentation">
                    <a th:href="@{/friends(tab='followers')}"
                       class="nav-link rounded-pill px-3 py-1 small"
                       th:classappend="${currentTab == 'followers'} ? 'active' : ''"
                       role="tab">
                        <i class="bi bi-person-heart me-1" aria-hidden="true"></i>Người theo dõi
                    </a>
                </li>
            </ul>
        </nav>
    </div>

    <!-- Users Grid -->
    <div th:if="${users != null and !users.isEmpty()}" class="d-flex flex-column gap-2 mb-3">
        <div th:each="u : ${users}" class="aloute-card p-3 d-flex justify-content-between align-items-center gap-3">
            <a th:href="@{'/users/' + ${u.username != null ? u.username : u.id}}" class="d-flex align-items-center gap-3 text-decoration-none text-reset flex-grow-1 aloute-min-w-0">
                <img th:src="${u.avatarUrl != null and !u.avatarUrl.isEmpty()} ? ${u.avatarUrl} : @{/images/avatar-fallback.svg}"
                     src="/images/avatar-fallback.svg"
                     class="avatar-img rounded-circle flex-shrink-0"
                     width="48"
                     height="48"
                     alt="Avatar" />
                <div class="aloute-min-w-0">
                    <div class="d-flex align-items-center gap-1">
                        <strong class="fs-6 text-dark text-truncate" th:text="${u.displayName ?: u.username}">User</strong>
                        <i th:if="${u.isVerified}" class="bi bi-patch-check-fill text-primary small" role="img" aria-label="Đã xác minh"></i>
                    </div>
                    <small class="text-muted d-block text-truncate" th:text="'@' + ${u.username}">@user</small>
                </div>
            </a>
            <div class="flex-shrink-0 d-flex gap-2 align-items-center">
                <a th:href="@{'/users/' + ${u.username != null ? u.username : u.id}}" class="btn btn-sm btn-outline-secondary rounded-pill px-3">
                    Xem hồ sơ
                </a>
            </div>
        </div>
    </div>

    <!-- Empty State -->
    <div th:if="${users == null or users.isEmpty()}" class="aloute-card text-center p-5 my-2">
        <div class="mb-3">
            <i class="bi bi-person-x fs-1 text-muted" aria-hidden="true"></i>
        </div>
        <h2 class="fs-6 fw-bold mb-1" th:text="${currentTab == 'followers'} ? 'Chưa có người theo dõi' : 'Chưa theo dõi người dùng nào'">Chưa có kết nối nào</h2>
        <p class="small text-secondary mb-3" th:text="${currentTab == 'followers'} ? 'Khi có người khác theo dõi bạn, họ sẽ xuất hiện tại đây.' : 'Hãy khám phá các thành viên trong trường và theo dõi để cập nhật bài viết mới nhất.'">
            Kết nối với bạn bè trên AloUTE để xem các chia sẻ thú vị.
        </p>
        <a th:href="@{/search(category='people')}" class="btn btn-sm btn-primary rounded-pill px-3">
            <i class="bi bi-search me-1" aria-hidden="true"></i>Tìm kiếm sinh viên
        </a>
    </div>
</div>
</body>
</html>
