<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/default :: layout(
        title='Bạn bè & Kết nối — AloUTE',
        content=~{::#friends-content},
        extraHead=~{::#friends-head},
        extraScripts=~{::#friends-scripts},
        activeTab='friends'
      )}">
<head id="friends-head">
</head>
<body>
    <div id="friends-content">
        <div class="friends-view" style="max-width: 680px; margin: 0 auto; width: 100%;">
            <!-- Header Card -->
            <div class="card-social friends-header-card" style="padding: 18px 20px; margin-bottom: 16px;">
                <h2 style="font-size: 18px; font-weight: 800; margin: 0; color: var(--text-main); display: flex; align-items: center; gap: 8px;">
                    <i class="fa-solid fa-user-group text-primary"></i> Bạn bè & Kết nối
                </h2>
                <p style="font-size: 12px; color: var(--text-muted); margin: 4px 0 0;">
                    Quản lý danh sách người bạn đang theo dõi và người theo dõi bạn.
                </p>
            </div>

            <!-- Filter Tabs -->
            <div class="card-social tabs-card" style="padding: 4px 12px; margin-bottom: 16px;">
                <div style="display: flex; gap: 8px;">
                    <a th:href="@{/friends(tab='following')}" 
                       class="tab-btn" 
                       th:classappend="${currentTab == null || currentTab == 'following' ? 'active' : ''}"
                       style="padding: 8px 16px; font-size: 13px; font-weight: 700; color: var(--text-secondary); text-decoration: none; border-bottom: 2px solid transparent;">
                        Đang theo dõi
                    </a>
                    <a th:href="@{/friends(tab='followers')}" 
                       class="tab-btn" 
                       th:classappend="${currentTab == 'followers' ? 'active' : ''}"
                       style="padding: 8px 16px; font-size: 13px; font-weight: 700; color: var(--text-secondary); text-decoration: none; border-bottom: 2px solid transparent;">
                        Người theo dõi
                    </a>
                    <a th:href="@{/friends(tab='suggested')}" 
                       class="tab-btn" 
                       th:classappend="${currentTab == 'suggested' ? 'active' : ''}"
                       style="padding: 8px 16px; font-size: 13px; font-weight: 700; color: var(--text-secondary); text-decoration: none; border-bottom: 2px solid transparent;">
                        Đề xuất
                    </a>
                </div>
            </div>

            <!-- Users Grid -->
            <div class="friends-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px;">
                <th:block th:if="${users != null && !users.isEmpty()}">
                    <div th:each="u : ${users}" 
                         class="card-social friend-card" 
                         style="padding: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
                        <div style="display: flex; align-items: center; gap: 12px; cursor: pointer; min-width: 0; flex: 1;" th:onclick="'window.location.href=\'/profile/' + ${u.username} + '\''">
                            <img th:src="${u.avatarUrl != null && !u.avatarUrl.isEmpty() ? u.avatarUrl : '/default-avatar.png'}" 
                                 class="avatar avatar-md" 
                                 alt="Avatar"
                                 onerror="this.src='https://ui-avatars.com/api/?name=User&background=50b5ff&color=fff'" />
                            <div style="min-width: 0; flex: 1;">
                                <strong style="display: block; font-size: 14px; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                                    <span th:text="${u.displayName != null ? u.displayName : u.username}">User</span>
                                    <i th:if="${u.verified}" class="fa-solid fa-circle-check verified-icon" style="color: var(--primary-color); font-size: 12px; margin-left: 2px;"></i>
                                </strong>
                                <small style="color: var(--text-muted); font-size: 12px;" th:text="'@' + ${u.username}">@user</small>
                            </div>
                        </div>

                        <a th:href="@{'/profile/' + ${u.username}}" class="btn-secondary" style="padding: 6px 14px; font-size: 12px; font-weight: 600; border-radius: var(--radius-pill); border: 1px solid var(--border-color); background: var(--bg-hover); color: var(--text-main); text-decoration: none; white-space: nowrap;">
                            Xem hồ sơ
                        </a>
                    </div>
                </th:block>

                <!-- Empty State -->
                <div th:if="${users == null || users.isEmpty()}" class="card-social empty-box text-center p-8" style="padding: 40px; text-align: center; grid-column: 1 / -1;">
                    <i class="fa-solid fa-user-group font-32 text-muted" style="font-size: 36px; color: var(--text-muted); margin-bottom: 12px; display: block;"></i>
                    <h3 style="font-size: 16px; font-weight: 700; margin-bottom: 4px; color: var(--text-main);">Chưa có người dùng nào</h3>
                    <p style="color: var(--text-muted); font-size: 13px; margin: 0;">Khám phá bảng tin và kết nối với các bạn sinh viên khác trên AloUTE.</p>
                </div>
            </div>
        </div>
    </div>
    <div id="friends-scripts"></div>
</body>
</html>
