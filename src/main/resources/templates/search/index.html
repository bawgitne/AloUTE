<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/default :: layout(
        title=${searchQuery != null && !searchQuery.isEmpty() ? 'Tìm kiếm: ' + searchQuery + ' — AloUTE' : 'Tìm kiếm — AloUTE'},
        content=~{::#search-content},
        extraHead=~{::#search-head},
        extraScripts=~{::#search-scripts},
        activeTab='search'
      )}">
<head id="search-head">
</head>
<body>
    <div id="search-content">
        <div class="search-page-view" style="max-width: 680px; margin: 0 auto; width: 100%;">
            <!-- Search Hero Header -->
            <div class="card-social search-hero-box" style="padding: 16px 20px; margin-bottom: 16px;">
                <form th:action="@{/search}" method="get" style="display: flex; gap: 10px; align-items: center;">
                    <div style="flex: 1; position: relative; display: flex; align-items: center;">
                        <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 14px; color: var(--text-muted);"></i>
                        <input type="text" 
                               name="q" 
                               th:value="${searchQuery}" 
                               placeholder="Tìm kiếm bài viết, người dùng, cộng đồng..." 
                               style="width: 100%; padding: 10px 16px 10px 40px; border-radius: var(--radius-pill); border: 1px solid var(--border-color); background: var(--bg-hover); color: var(--text-main); font-size: 13px; outline: none;" />
                        <input type="hidden" name="tab" th:value="${currentTab != null ? currentTab : 'posts'}" />
                    </div>
                    <button type="submit" class="btn-primary" style="padding: 10px 20px; border-radius: var(--radius-pill); font-weight: 700; font-size: 13px;">
                        Tìm kiếm
                    </button>
                </form>
            </div>

            <!-- Search Filter Tabs -->
            <div class="card-social search-tabs-bar" style="padding: 4px 12px; margin-bottom: 16px;">
                <div style="display: flex; gap: 8px;">
                    <a th:href="@{/search(q=${searchQuery}, tab='posts')}" 
                       class="tab-btn" 
                       th:classappend="${currentTab == null || currentTab == 'posts' ? 'active' : ''}"
                       style="padding: 8px 16px; font-size: 13px; font-weight: 700; color: var(--text-secondary); text-decoration: none; border-bottom: 2px solid transparent;">
                        <i class="fa-solid fa-newspaper"></i> Bài viết
                    </a>
                    <a th:href="@{/search(q=${searchQuery}, tab='people')}" 
                       class="tab-btn" 
                       th:classappend="${currentTab == 'people' ? 'active' : ''}"
                       style="padding: 8px 16px; font-size: 13px; font-weight: 700; color: var(--text-secondary); text-decoration: none; border-bottom: 2px solid transparent;">
                        <i class="fa-solid fa-user"></i> Người dùng
                    </a>
                    <a th:href="@{/search(q=${searchQuery}, tab='communities')}" 
                       class="tab-btn" 
                       th:classappend="${currentTab == 'communities' ? 'active' : ''}"
                       style="padding: 8px 16px; font-size: 13px; font-weight: 700; color: var(--text-secondary); text-decoration: none; border-bottom: 2px solid transparent;">
                        <i class="fa-solid fa-users"></i> Cộng đồng
                    </a>
                </div>
            </div>

            <!-- Search Results Stream -->
            <div class="search-results-stream">
                <!-- Posts Tab Results -->
                <div th:if="${currentTab == null || currentTab == 'posts'}">
                    <th:block th:if="${posts != null && !posts.isEmpty()}">
                        <div th:each="post : ${posts}" th:replace="~{post/_post-card :: postCard(post=${post})}"></div>
                    </th:block>
                    <div th:if="${posts == null || posts.isEmpty()}" class="card-social empty-box text-center p-8" style="padding: 40px; text-align: center;">
                        <i class="fa-solid fa-magnifying-glass font-32 text-muted" style="font-size: 36px; color: var(--text-muted); margin-bottom: 12px; display: block;"></i>
                        <h3 style="font-size: 16px; font-weight: 700; margin-bottom: 4px; color: var(--text-main);">Không tìm thấy bài viết nào</h3>
                        <p style="color: var(--text-muted); font-size: 13px; margin: 0;">Thử tìm kiếm với từ khóa khác.</p>
                    </div>
                </div>

                <!-- People Tab Results -->
                <div th:if="${currentTab == 'people'}">
                    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px;">
                        <th:block th:if="${users != null && !users.isEmpty()}">
                            <div th:each="u : ${users}" class="card-social" style="padding: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
                                <div style="display: flex; align-items: center; gap: 12px; cursor: pointer; min-width: 0; flex: 1;" th:onclick="'window.location.href=\'/profile/' + ${u.username} + '\''">
                                    <img th:src="${u.avatarUrl != null && !u.avatarUrl.isEmpty() ? u.avatarUrl : '/default-avatar.png'}" class="avatar avatar-md" alt="Avatar" />
                                    <div style="min-width: 0; flex: 1;">
                                        <strong style="display: block; font-size: 14px; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" th:text="${u.displayName != null ? u.displayName : u.username}">User</strong>
                                        <small style="color: var(--text-muted); font-size: 12px;" th:text="'@' + ${u.username}">@user</small>
                                    </div>
                                </div>
                                <a th:href="@{'/profile/' + ${u.username}}" class="btn-secondary" style="padding: 6px 14px; font-size: 12px; font-weight: 600; border-radius: var(--radius-pill); border: 1px solid var(--border-color); background: var(--bg-hover); color: var(--text-main); text-decoration: none;">
                                    Xem
                                </a>
                            </div>
                        </th:block>
                    </div>
                    <div th:if="${users == null || users.isEmpty()}" class="card-social empty-box text-center p-8" style="padding: 40px; text-align: center;">
                        <i class="fa-solid fa-user-slash font-32 text-muted" style="font-size: 36px; color: var(--text-muted); margin-bottom: 12px; display: block;"></i>
                        <h3 style="font-size: 16px; font-weight: 700; margin-bottom: 4px; color: var(--text-main);">Không tìm thấy người dùng</h3>
                        <p style="color: var(--text-muted); font-size: 13px; margin: 0;">Thử tìm kiếm với tên hoặc @username khác.</p>
                    </div>
                </div>

                <!-- Communities Tab Results -->
                <div th:if="${currentTab == 'communities'}">
                    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px;">
                        <th:block th:if="${communities != null && !communities.isEmpty()}">
                            <div th:each="comm : ${communities}" class="card-social" style="padding: 16px; cursor: pointer;" th:onclick="'window.location.href=\'/c/' + ${comm.slug} + '\''">
                                <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 8px;">
                                    <img th:src="${comm.avatarUrl != null ? comm.avatarUrl : 'https://ui-avatars.com/api/?name=' + comm.name + '&background=50b5ff&color=fff'}" class="avatar avatar-md rounded-xl" alt="Avatar" />
                                    <div>
                                        <strong style="display: block; font-size: 14px; color: var(--text-main);" th:text="${comm.name}">Community</strong>
                                        <small style="color: var(--text-muted); font-size: 12px;" th:text="'c/' + ${comm.slug}">c/slug</small>
                                    </div>
                                </div>
                                <p style="font-size: 12px; color: var(--text-secondary); margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;" th:text="${comm.description}">Description</p>
                            </div>
                        </th:block>
                    </div>
                    <div th:if="${communities == null || communities.isEmpty()}" class="card-social empty-box text-center p-8" style="padding: 40px; text-align: center;">
                        <i class="fa-solid fa-users-slash font-32 text-muted" style="font-size: 36px; color: var(--text-muted); margin-bottom: 12px; display: block;"></i>
                        <h3 style="font-size: 16px; font-weight: 700; margin-bottom: 4px; color: var(--text-main);">Không tìm thấy cộng đồng</h3>
                        <p style="color: var(--text-muted); font-size: 13px; margin: 0;">Thử tìm kiếm với tên cộng đồng khác.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="search-scripts"></div>
</body>
</html>
