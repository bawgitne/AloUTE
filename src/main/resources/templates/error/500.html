<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/default :: layout(title='500 — Lỗi máy chủ nội bộ', content=~{::#error-content})}">
<body>
    <div id="error-content">
        <div class="aloute-card text-center p-4 p-md-5 my-3">
            <div class="mb-3">
                <i class="bi bi-exclamation-triangle fs-1 text-danger" style="font-size: 3.5rem !important;" aria-hidden="true"></i>
            </div>
            <h1 class="fs-4 fw-bold mb-2 text-dark">500 — Đã xảy ra sự cố hệ thống</h1>
            <p class="text-secondary small mb-4" style="max-width: 480px; margin-left: auto; margin-right: auto;">
                Máy chủ gặp sự cố ngoài ý muốn trong quá trình xử lý yêu cầu. Vui lòng thử tải lại trang hoặc quay lại bảng tin chính.
            </p>
            <div class="d-flex justify-content-center gap-2 flex-wrap">
                <button type="button" onclick="window.location.reload()" class="btn btn-sm btn-primary rounded-pill px-4">
                    <i class="bi bi-arrow-clockwise me-1" aria-hidden="true"></i>Tải lại trang
                </button>
                <a th:href="@{/feed}" href="/feed" class="btn btn-sm btn-outline-secondary rounded-pill px-3">
                    <i class="bi bi-house-door me-1" aria-hidden="true"></i>Về bảng tin chính
                </a>
            </div>
        </div>
    </div>
</body>
</html>
