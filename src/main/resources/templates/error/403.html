<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/default :: layout(title='403 — Không có quyền truy cập', content=~{::#error-content})}">
<body>
    <div id="error-content">
        <div class="aloute-card text-center p-4 p-md-5 my-3">
            <div class="mb-3">
                <i class="bi bi-shield-lock fs-1 text-warning" style="font-size: 3.5rem !important;" aria-hidden="true"></i>
            </div>
            <h1 class="fs-4 fw-bold mb-2 text-dark">403 — Không có quyền truy cập</h1>
            <p class="text-secondary small mb-3" style="max-width: 480px; margin-left: auto; margin-right: auto;">
                Bạn không có quyền truy cập trang hoặc chức năng này. Nếu bạn cho rằng đây là nhầm lẫn, vui lòng liên hệ ban quản trị.
            </p>
            <div th:if="${path != null}" class="mb-4">
                <code class="small bg-light px-2 py-1 rounded text-muted" th:text="${path}">/admin</code>
            </div>
            <div class="d-flex justify-content-center gap-2 flex-wrap">
                <a th:href="@{/feed}" href="/feed" class="btn btn-sm btn-primary rounded-pill px-4">
                    <i class="bi bi-house-door me-1" aria-hidden="true"></i>Về bảng tin chính
                </a>
                <button type="button" onclick="window.history.back()" class="btn btn-sm btn-outline-secondary rounded-pill px-3">
                    <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Quay lại trang trước
                </button>
            </div>
        </div>
    </div>
</body>
</html>
