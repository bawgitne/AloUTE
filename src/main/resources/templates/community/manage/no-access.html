<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/default :: layout(title='Không có quyền truy cập', content=~{::#community-manage-content})}">
<body>
<div id="community-manage-content">
    <div class="aloute-card text-center p-4 p-md-5 my-3">
        <div class="mb-3">
            <i class="bi fs-1" th:classappend="${notFound} ? 'bi-compass text-warning' : 'bi-shield-lock text-danger'" aria-hidden="true"></i>
        </div>
        <h1 class="fs-5 fw-bold mb-1" th:text="${notFound} ? 'Không tìm thấy cộng đồng' : 'Bạn không có quyền quản lý cộng đồng này'">Không có quyền</h1>
        <p class="small text-secondary mb-3">
            <th:block th:if="${notFound}">Cộng đồng không tồn tại, đã bị xóa, hoặc bạn không có quyền xem nó.</th:block>
            <th:block th:unless="${notFound}">Chỉ chủ sở hữu và quản trị viên cộng đồng mới được mở trang quản lý.</th:block>
        </p>
        <div class="d-flex gap-2 justify-content-center flex-wrap">
            <a th:href="@{/communities}" class="btn btn-sm btn-primary rounded-pill px-3">
                <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Quay lại danh sách cộng đồng
            </a>
            <a th:href="@{/feed}" class="btn btn-sm btn-outline-secondary rounded-pill px-3">Về bảng tin</a>
        </div>
    </div>
</div>
</body>
</html>
