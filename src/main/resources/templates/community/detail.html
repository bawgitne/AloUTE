<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/default :: layout(
        title=${community != null ? community.name + ' — AloUTE' : 'Chi tiết Cộng đồng — AloUTE'},
        content=~{::#community-detail-content},
        extraHead=~{::#community-detail-head},
        extraScripts=~{::#community-detail-scripts},
        activeTab='communities'
      )}">
<head id="community-detail-head">
</head>
<body>
    <div id="community-detail-content">
        <div th:if="${community != null}" class="community-detail-view">
            <!-- Header Banner -->
            <div class="card-social detail-header-card">
                <div class="detail-cover-wrapper" style="height: 180px; overflow: hidden; border-radius: var(--radius-lg) var(--radius-lg) 0 0; background: linear-gradient(135deg, #1e293b, #0f172a);">
                    <img th:src="${community.coverUrl != null && !community.coverUrl.isEmpty() ? community.coverUrl : 'https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=1200'}" 
                         class="detail-cover" 
                         style="width: 100%; height: 100%; object-fit: cover;" 
                         alt="Cover" />
                </div>
                <div class="detail-header-body" style="padding: 16px 24px 20px;">
                    <div class="detail-avatar-row" style="display: flex; justify-content: space-between; align-items: flex-end; margin-top: -50px; margin-bottom: 16px;">
                        <img th:src="${community.avatarUrl != null and !community.avatarUrl.isEmpty()} ? ${community.avatarUrl} : @{/images/avatar-fallback.svg}"
                             src="/images/avatar-fallback.svg"
                             class="avatar avatar-xl detail-avatar" 
                             style="width: 90px; height: 90px; border-radius: var(--radius-lg); border: 4px solid var(--bg-card); background: var(--bg-card);" 
                             alt="Avatar" />
                        <div class="detail-action-buttons" style="display: flex; gap: 10px;">
                            <button type="button" 
                                    class="btn-primary" 
                                    style="padding: 8px 20px; font-size: 13px; font-weight: 700; border-radius: var(--radius-pill);"
                                    data-bs-toggle="modal" 
                                    data-bs-target="#createPostModal">
                                <i class="fa-solid fa-plus"></i> Đăng bài
                            </button>
                        </div>
                    </div>

                    <div class="detail-title-group">
                        <h2 style="font-size: 22px; font-weight: 800; margin: 0 0 4px; color: var(--text-main);" th:text="${community.name}">Community Name</h2>
                        <span class="community-slug" style="font-size: 13px; font-weight: 600; color: var(--primary-color);" th:text="'c/' + ${community.slug}">c/slug</span>
                        <p class="community-description" style="font-size: 14px; color: var(--text-secondary); margin: 8px 0 0;" th:text="${community.description != null ? community.description : 'Không có mô tả cho cộng đồng này.'}">
                            Mô tả cộng đồng
                        </p>
                    </div>

                    <div class="detail-meta-counters" style="display: flex; gap: 20px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border-color); font-size: 13px; color: var(--text-muted);">
                        <div class="counter-item">
                            <strong style="color: var(--text-main);" th:text="${community.membersCount != null ? community.membersCount : (community.memberCount != null ? community.memberCount : 0)}">0</strong>
                            <span>Thành viên</span>
                        </div>
                        <div class="counter-item">
                            <strong style="color: var(--text-main);" th:text="${community.postsCount != null ? community.postsCount : (community.postCount != null ? community.postCount : 0)}">0</strong>
                            <span>Bài viết</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Posts Stream inside Community -->
            <div class="community-feed-column" style="margin-top: 16px;">
                <div class="posts-stream">
                    <th:block th:if="${posts != null && !posts.isEmpty()}">
                        <div th:each="post : ${posts}" th:replace="~{post/_post-card :: postCard(post=${post})}"></div>
                    </th:block>

                    <!-- Empty Posts in Community -->
                    <div th:if="${posts == null || posts.isEmpty()}" class="card-social empty-box text-center p-8" style="padding: 40px; text-align: center;">
                        <i class="fa-regular fa-comments font-32 text-muted" style="font-size: 36px; color: var(--text-muted); margin-bottom: 12px; display: block;"></i>
                        <h3 style="font-size: 16px; font-weight: 700; margin-bottom: 6px;">Chưa có bài viết nào</h3>
                        <p style="color: var(--text-muted); font-size: 13px;">Hãy là người đầu tiên chia sẻ bài viết trong cộng đồng này!</p>
                        <button type="button" class="btn-primary" style="margin-top: 14px; padding: 8px 20px; font-size: 13px; font-weight: 700; border-radius: var(--radius-pill);" data-bs-toggle="modal" data-bs-target="#createPostModal">
                            <i class="fa-solid fa-pen-to-square"></i> Tạo bài viết ngay
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="community-detail-scripts"></div>
</body>
</html>
