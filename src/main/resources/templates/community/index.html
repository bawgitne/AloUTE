<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/default :: layout(
        title='Cộng đồng — AloUTE',
        content=~{::#communities-content},
        extraHead=~{::#communities-head},
        extraScripts=~{::#communities-scripts},
        activeTab='communities'
      )}">
<head id="communities-head">
</head>
<body>
    <div id="communities-content">
        <div class="communities-view-layout">
            <!-- Main Center Column: Community Scroll Feed -->
            <div class="feed-column">
                <!-- Joined Community Filter Pills & Create Community Button -->
                <div class="card-social feed-filter-bar flex justify-between items-center" style="display: flex; justify-content: space-between; align-items: center;">
                    <div class="flex gap-2 items-center overflow-x-auto flex-1" style="display: flex; gap: 8px; align-items: center; overflow-x: auto;">
                        <a th:href="@{/communities}" class="filter-pill active">
                            <i class="fa-solid fa-layer-group"></i> Tất cả bài viết
                        </a>
                        <th:block th:each="comm : ${communities}">
                            <a th:href="@{'/c/' + ${comm.slug}}" class="filter-pill comm-pill">
                                <img th:src="${comm.avatarUrl != null ? comm.avatarUrl : 'https://ui-avatars.com/api/?name=' + comm.name + '&background=50b5ff&color=fff'}" class="pill-avatar" alt="avatar" />
                                <span th:text="'c/' + ${comm.slug}">c/slug</span>
                            </a>
                        </th:block>
                    </div>

                    <button type="button" class="btn-primary flex-shrink-0" style="padding: 8px 16px; font-size: 13px; font-weight: 700; border-radius: var(--radius-pill); white-space: nowrap;" data-bs-toggle="modal" data-bs-target="#createCommunityModal">
                        <i class="fa-solid fa-plus"></i> Tạo Cộng Đồng
                    </button>
                </div>

                <!-- Community Grid List -->
                <div class="communities-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-top: 16px;">
                    <th:block th:each="comm : ${communities}">
                        <div class="card-social community-card-box" style="padding: 16px; display: flex; flex-direction: column; gap: 12px; transition: transform 0.2s, box-shadow 0.2s;">
                            <div style="display: flex; align-items: center; gap: 12px; cursor: pointer;" th:onclick="'window.location.href=\'/c/' + ${comm.slug} + '\''">
                                <img th:src="${comm.avatarUrl != null ? comm.avatarUrl : 'https://ui-avatars.com/api/?name=' + comm.name + '&background=50b5ff&color=fff'}" 
                                     class="avatar avatar-lg" 
                                     style="border-radius: var(--radius-md);" 
                                     alt="Avatar" />
                                <div style="flex: 1; min-width: 0;">
                                    <h4 style="font-size: 15px; font-weight: 700; margin: 0; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" th:text="${comm.name}">Community Name</h4>
                                    <small style="color: var(--text-muted); font-size: 12px;" th:text="'c/' + ${comm.slug}">c/slug</small>
                                </div>
                            </div>
                            <p style="font-size: 13px; color: var(--text-secondary); margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 38px;" th:text="${comm.description != null ? comm.description : 'Cộng đồng thảo luận và kết nối sinh viên AloUTE.'}">
                                Mô tả cộng đồng
                            </p>
                            <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 8px; border-top: 1px solid var(--border-color); font-size: 12px; color: var(--text-muted);">
                                <span><i class="fa-solid fa-users"></i> <strong th:text="${comm.membersCount != null ? comm.membersCount : (comm.memberCount != null ? comm.memberCount : 0)}">0</strong> thành viên</span>
                                <a th:href="@{'/c/' + ${comm.slug}}" class="btn-primary" style="padding: 6px 14px; font-size: 12px; font-weight: 700; border-radius: var(--radius-pill); text-decoration: none;">
                                    Khám phá
                                </a>
                            </div>
                        </div>
                    </th:block>
                </div>

                <!-- Empty Communities State -->
                <div th:if="${communities == null || communities.isEmpty()}" class="card-social empty-box text-center p-8" style="padding: 40px; text-align: center; margin-top: 20px;">
                    <div style="font-size: 48px; color: var(--primary-color); margin-bottom: 12px;">
                        <i class="fa-solid fa-users-slash"></i>
                    </div>
                    <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 6px;">Chưa có cộng đồng nào</h3>
                    <p style="color: var(--text-muted); font-size: 13px;">Hãy là người đầu tiên tạo cộng đồng mới trên AloUTE!</p>
                </div>
            </div>

            <!-- Right Sidebar Column: Suggested Communities -->
            <aside class="sidebar-right-column">
                <div class="card-social widget-card">
                    <div class="widget-header">
                        <h3><i class="fa-solid fa-compass text-warning"></i> Khám phá</h3>
                    </div>
                    <div class="widget-body">
                        <p style="font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin: 0 0 12px 0;">
                            Cộng đồng là nơi giao lưu, chia sẻ bài tập, tài liệu học tập và các chủ đề chuyên sâu của UTE.
                        </p>
                        <a th:href="@{/feed}" class="btn-primary" style="display: flex; justify-content: center; align-items: center; gap: 8px; padding: 10px; font-size: 13px; border-radius: var(--radius-pill); text-decoration: none;">
                            <i class="fa-solid fa-house"></i> Về bảng tin
                        </a>
                    </div>
                </div>
            </aside>
        </div>
    </div>
    <div id="communities-scripts"></div>
</body>
</html>
