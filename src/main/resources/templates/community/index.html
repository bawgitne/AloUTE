<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/default :: layout(title='Cộng đồng', content=~{::#communities-content})}">
<body>
    <div id="communities-content">
        <!-- Header & Action Bar -->
        <div class="aloute-card p-3 mb-3">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                <div>
                    <h1 class="fs-5 fw-bold mb-1 d-flex align-items-center gap-2">
                        <i class="bi bi-people-fill text-primary" aria-hidden="true"></i>
                        <span>Cộng đồng &amp; Câu lạc bộ</span>
                    </h1>
                    <p class="small text-secondary mb-0">Không gian học thuật, giao lưu và sinh hoạt chuyên đề sinh viên HCMUTE</p>
                </div>
                <div class="d-flex gap-2 align-items-center">
                    <button th:if="${currentUser != null}"
                            type="button"
                            class="btn btn-sm btn-primary rounded-pill"
                            data-bs-toggle="modal"
                            data-bs-target="#createCommunityModal"
                            id="btn-open-create-community">
                        <i class="bi bi-plus-lg me-1" aria-hidden="true"></i>Tạo cộng đồng
                    </button>
                    <a th:href="@{/feed}" class="btn btn-sm btn-outline-secondary rounded-pill">
                        <i class="bi bi-house-door me-1" aria-hidden="true"></i>Về bảng tin
                    </a>
                </div>
            </div>

            <!-- Community Filter Pills (if any) -->
            <div th:if="${communities != null and !communities.isEmpty()}" class="d-flex gap-2 align-items-center overflow-x-auto pt-2 mt-2 border-top border-subtle">
                <a th:href="@{/communities}" class="btn btn-sm btn-primary rounded-pill flex-shrink-0">
                    <i class="bi bi-collection me-1" aria-hidden="true"></i>Tất cả
                </a>
                <th:block th:each="comm : ${communities}">
                    <a th:href="@{'/communities/' + ${comm.slug != null ? comm.slug : comm.id}}" class="btn btn-sm btn-light border rounded-pill d-inline-flex align-items-center gap-1 flex-shrink-0 text-decoration-none">
                        <img th:src="${comm.avatarUrl != null and !comm.avatarUrl.isEmpty()} ? ${comm.avatarUrl} : @{/images/avatar-fallback.svg}"
                             src="/images/avatar-fallback.svg"
                             class="avatar-img rounded-circle"
                             width="18"
                             height="18"
                             alt="Avatar" />
                        <span class="small" th:text="'c/' + ${comm.slug}">c/slug</span>
                    </a>
                </th:block>
            </div>
        </div>

        <!-- Community Grid List -->
        <div th:if="${communities != null and !communities.isEmpty()}" class="row g-3">
            <div class="col-12 col-md-6" th:each="comm : ${communities}">
                <div class="aloute-card h-100 d-flex flex-column p-3">
                    <a th:href="@{'/communities/' + ${comm.slug != null ? comm.slug : comm.id}}" class="d-flex align-items-center gap-3 text-decoration-none text-reset mb-2">
                        <img th:src="${comm.avatarUrl != null and !comm.avatarUrl.isEmpty()} ? ${comm.avatarUrl} : @{/images/avatar-fallback.svg}"
                             src="/images/avatar-fallback.svg"
                             class="avatar-img rounded-3 flex-shrink-0"
                             width="48"
                             height="48"
                             style="object-fit: cover;"
                             alt="Avatar cộng đồng" />
                        <div class="aloute-min-w-0 flex-grow-1">
                            <h2 class="fs-6 fw-bold mb-0 text-truncate text-dark" th:text="${comm.name}">Tên cộng đồng</h2>
                            <small class="text-primary fw-medium" th:text="'c/' + ${comm.slug}">c/slug</small>
                        </div>
                    </a>
                    <p class="small text-secondary flex-grow-1 mb-3"
                       style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.6rem;"
                       th:text="${comm.description != null ? comm.description : 'Cộng đồng thảo luận và kết nối sinh viên AloUTE.'}">
                        Mô tả cộng đồng
                    </p>
                    <div class="d-flex justify-content-between align-items-center pt-2 border-top border-subtle small text-muted mt-auto">
                        <span>
                            <i class="bi bi-people me-1" aria-hidden="true"></i>
                            <strong class="text-dark" th:text="${comm.memberCount != null ? comm.memberCount : 0}">0</strong> thành viên
                        </span>
                        <a th:href="@{'/communities/' + ${comm.slug != null ? comm.slug : comm.id}}" class="btn btn-sm btn-primary rounded-pill px-3">
                            Khám phá
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Empty Communities State -->
        <div th:if="${communities == null or communities.isEmpty()}" class="aloute-card text-center p-4 my-3">
            <div class="mb-3">
                <i class="bi bi-people fs-1 text-primary" aria-hidden="true"></i>
            </div>
            <h2 class="fs-6 fw-bold mb-1">Chưa có cộng đồng nào</h2>
            <p class="small text-secondary mb-3">Hiện chưa có cộng đồng nào được tạo trên hệ thống AloUTE.</p>
            <a th:href="@{/feed}" class="btn btn-sm btn-primary rounded-pill px-3">
                <i class="bi bi-house-door me-1" aria-hidden="true"></i>Về bảng tin chính
            </a>
        </div>
    </div>
</body>
</html>
