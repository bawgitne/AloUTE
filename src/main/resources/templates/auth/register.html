<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/auth :: layout(title='Đăng ký tài khoản', content=~{::#register-content})}">
<body>
<div id="register-content">
    <!-- Registration Form (Neutralized presentational form hook; pending backend registration action) -->
    <form action="#" onsubmit="return false;" data-action="register" class="needs-validation" novalidate>
        <!-- Form-Level Error Feedback if any -->
        <div th:if="${registrationError != null}" class="alert alert-danger py-2 small mb-3" role="alert">
            <i class="bi bi-exclamation-circle me-1" aria-hidden="true"></i>
            <span th:text="${registrationError}">Đăng ký không thành công. Vui lòng kiểm tra lại thông tin.</span>
        </div>

        <!-- Username Field -->
        <div class="mb-3">
            <label for="username" class="form-label">Tên người dùng (Username)</label>
            <input type="text"
                   class="form-control"
                   id="username"
                   name="username"
                   th:value="${param.username}"
                   placeholder="nguyenvana (3-50 ký tự)"
                   minlength="3"
                   maxlength="50"
                   autocomplete="username"
                   required>
            <div class="form-text">Tên người dùng viết liền không dấu, chỉ gồm chữ cái và số.</div>
            <div th:if="${fieldErrors != null and fieldErrors.username != null}"
                 class="invalid-feedback d-block"
                 th:text="${fieldErrors.username}">
                Tên người dùng không hợp lệ.
            </div>
        </div>

        <!-- Email Field -->
        <div class="mb-3">
            <label for="email" class="form-label">Email trường hoặc cá nhân</label>
            <input type="email"
                   class="form-control"
                   id="email"
                   name="email"
                   th:value="${param.email}"
                   placeholder="user@student.hcmute.edu.vn"
                   maxlength="254"
                   autocomplete="email"
                   required>
            <div th:if="${fieldErrors != null and fieldErrors.email != null}"
                 class="invalid-feedback d-block"
                 th:text="${fieldErrors.email}">
                Email không hợp lệ hoặc đã tồn tại.
            </div>
        </div>

        <!-- Password Field -->
        <div class="mb-3">
            <label for="password" class="form-label">Mật khẩu</label>
            <input type="password"
                   class="form-control"
                   id="password"
                   name="password"
                   placeholder="Tối thiểu 8 ký tự"
                   minlength="8"
                   maxlength="128"
                   autocomplete="new-password"
                   required>
            <div th:if="${fieldErrors != null and fieldErrors.password != null}"
                 class="invalid-feedback d-block"
                 th:text="${fieldErrors.password}">
                Mật khẩu phải có ít nhất 8 ký tự.
            </div>
        </div>

        <!-- Confirm Password Field -->
        <div class="mb-4">
            <label for="confirmPassword" class="form-label">Xác nhận mật khẩu</label>
            <input type="password"
                   class="form-control"
                   id="confirmPassword"
                   name="confirmPassword"
                   placeholder="Nhập lại mật khẩu"
                   minlength="8"
                   maxlength="128"
                   autocomplete="new-password"
                   required>
        </div>

        <!-- Submit Button -->
        <div class="d-grid mb-3">
            <button type="button" class="btn btn-primary py-2 fw-semibold" data-action="register">
                <i class="bi bi-person-plus me-1" aria-hidden="true"></i>
                <span>Tạo tài khoản</span>
            </button>
        </div>

        <!-- Switch to Login Link (Presentational hook) -->
        <div class="text-center pt-2 border-top border-secondary-subtle">
            <p class="small text-secondary mb-0">
                Đã có tài khoản AloUTE?
                <a href="#" data-page="auth-login" data-action="navigate-login" class="fw-semibold text-primary">Đăng nhập</a>
            </p>
        </div>
    </form>
</div>
</body>
</html>
