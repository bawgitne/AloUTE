<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/auth :: layout(title='Đặt lại mật khẩu', content=~{::#reset-password-content})}">
<head>
    <meta name="referrer" content="no-referrer">
</head>
<body>
<div id="reset-password-content">
    <form id="reset-password-form" data-action="reset-password" method="post" class="needs-validation" novalidate>
        <!-- Accessible Status Feedback Region -->
        <div id="auth-status" class="alert d-none py-2 small mb-3" role="status" aria-live="polite"></div>

        <p class="text-secondary small mb-3">
            Vui lòng nhập mật khẩu mới cho tài khoản của bạn. Mật khẩu phải có độ dài từ 8 đến 128 ký tự.
        </p>

        <!-- Hidden Token Field -->
        <input type="hidden" id="reset-token" name="token" value="">

        <!-- New Password Field -->
        <div class="mb-3">
            <label for="password" class="form-label">Mật khẩu mới</label>
            <div class="input-group">
                <input type="password"
                       class="form-control"
                       id="password"
                       name="password"
                       placeholder="Nhập ít nhất 8 ký tự"
                       autocomplete="new-password"
                       minlength="8"
                       maxlength="128"
                       aria-describedby="password-feedback"
                       aria-invalid="false"
                       required>
            </div>
            <div class="invalid-feedback d-none" id="password-feedback">Mật khẩu phải từ 8 đến 128 ký tự.</div>
        </div>

        <!-- Confirm Password Field -->
        <div class="mb-4">
            <label for="confirmPassword" class="form-label">Xác nhận mật khẩu mới</label>
            <div class="input-group">
                <input type="password"
                       class="form-control"
                       id="confirmPassword"
                       name="confirmPassword"
                       placeholder="Nhập lại mật khẩu mới"
                       autocomplete="new-password"
                       minlength="8"
                       maxlength="128"
                       aria-describedby="confirmPassword-feedback"
                       aria-invalid="false"
                       required>
            </div>
            <div class="invalid-feedback d-none" id="confirmPassword-feedback">Mật khẩu xác nhận không khớp.</div>
        </div>

        <!-- Submit Button -->
        <div class="d-grid mb-3">
            <button type="submit" class="btn btn-primary py-2 fw-semibold" id="reset-submit-btn" data-action="reset-password-submit">
                <span class="spinner-border spinner-border-sm d-none me-1" id="reset-spinner" role="status" aria-hidden="true"></span>
                <i class="bi bi-shield-check me-1" id="reset-icon" aria-hidden="true"></i>
                <span id="reset-btn-text">Lưu mật khẩu mới</span>
            </button>
        </div>

        <!-- Back to Login Link -->
        <div class="text-center pt-2 border-top border-secondary-subtle">
            <p class="small text-secondary mb-0">
                Đã nhớ mật khẩu?
                <a th:href="@{/login}" href="/login" data-action="navigate-login" class="fw-semibold text-primary">Đăng nhập</a>
            </p>
        </div>
    </form>
</div>
</body>
</html>
