<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/auth :: layout(title='Quên mật khẩu', content=~{::#forgot-password-content})}">
<body>
<div id="forgot-password-content">
    <form id="forgot-password-form" data-action="forgot-password" method="post" class="needs-validation" novalidate>
        <div id="auth-status" class="alert d-none py-2 small mb-3" role="status" aria-live="polite"></div>

        <p class="text-secondary small mb-3">
            Nhập địa chỉ email tài khoản UTE của bạn. Nếu tài khoản tồn tại, hệ thống sẽ gửi liên kết hướng dẫn đặt lại mật khẩu.
        </p>

        <!-- Email Field -->
        <div class="mb-3">
            <label for="email" class="form-label">Email UTE</label>
            <div class="input-group">
                <input type="email"
                       class="form-control"
                       id="email"
                       name="email"
                       placeholder="user@student.hcmute.edu.vn"
                       autocomplete="email"
                       maxlength="254"
                       aria-describedby="email-feedback"
                       aria-invalid="false"
                       required>
            </div>
            <div class="invalid-feedback d-none" id="email-feedback">Email không được để trống.</div>
        </div>

        <!-- Submit Button -->
        <div class="d-grid mb-3">
            <button type="submit" class="btn btn-primary py-2 fw-semibold" id="forgot-submit-btn" data-action="forgot-password-submit">
                <span class="spinner-border spinner-border-sm d-none me-1" id="forgot-spinner" role="status" aria-hidden="true"></span>
                <i class="bi bi-envelope me-1" id="forgot-icon" aria-hidden="true"></i>
                <span id="forgot-btn-text">Gửi liên kết đặt lại</span>
            </button>
        </div>

        <!-- Back to Login Link -->
        <div class="text-center pt-2 border-top border-secondary-subtle">
            <p class="small text-secondary mb-0">
                Đã nhớ mật khẩu?
                <a th:href="@{/login}" href="/login" data-action="navigate-login" class="fw-semibold text-primary">Đăng nhập</a>
            </p>
        </div>
    </form>
</div>
</body>
</html>
