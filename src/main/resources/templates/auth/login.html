<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/auth :: layout(title='Đăng nhập', content=~{::#login-content})}">
<body>
<div id="login-content">
    <!-- Semantic Login Form -->
    <form id="login-form" data-action="login" class="needs-validation" novalidate>
        <!-- Accessible Status Feedback Region -->
        <div id="auth-status" class="alert d-none py-2 small mb-3" role="status" aria-live="polite"></div>

        <!-- Server-rendered feedback parameters -->
        <div th:if="${param.registered != null}" class="alert alert-success py-2 small mb-3" role="status">
            <i class="bi bi-check-circle me-1" aria-hidden="true"></i>
            <span>Đăng ký tài khoản thành công! Vui lòng đăng nhập để tiếp tục.</span>
        </div>

        <div th:if="${param.error != null}" class="alert alert-danger py-2 small mb-3" role="alert">
            <i class="bi bi-exclamation-circle me-1" aria-hidden="true"></i>
            <span>Email hoặc mật khẩu không chính xác. Vui lòng thử lại.</span>
        </div>

        <div th:if="${param.logout != null}" class="alert alert-info py-2 small mb-3" role="status">
            <i class="bi bi-info-circle me-1" aria-hidden="true"></i>
            <span>Bạn đã đăng xuất thành công khỏi hệ thống.</span>
        </div>

        <!-- Email Field -->
        <div class="mb-3">
            <label for="email" class="form-label">Email UTE</label>
            <div class="input-group">
                <input type="email"
                       class="form-control"
                       id="email"
                       name="email"
                       th:value="${param.email}"
                       placeholder="user@student.hcmute.edu.vn"
                       autocomplete="email"
                       maxlength="254"
                       aria-describedby="email-feedback"
                       aria-invalid="false"
                       required>
            </div>
            <div class="invalid-feedback d-none" id="email-feedback">Email không được để trống.</div>
        </div>

        <!-- Password Field -->
        <div class="mb-4">
            <div class="d-flex justify-content-between align-items-center mb-1">
                <label for="password" class="form-label mb-0">Mật khẩu</label>
                <a th:href="@{/forgot-password}" href="/forgot-password" class="small text-primary text-decoration-none" data-action="navigate-forgot-password">Quên mật khẩu?</a>
            </div>
            <div class="input-group">
                <input type="password"
                       class="form-control"
                       id="password"
                       name="password"
                       placeholder="Nhập mật khẩu của bạn"
                       autocomplete="current-password"
                       aria-describedby="password-feedback"
                       aria-invalid="false"
                       required>
            </div>
            <div class="invalid-feedback d-none" id="password-feedback">Mật khẩu không được để trống.</div>
        </div>

        <!-- Submit Button -->
        <div class="d-grid mb-3">
            <button type="submit" class="btn btn-primary py-2 fw-semibold" id="login-submit-btn" data-action="login">
                <span class="spinner-border spinner-border-sm d-none me-1" id="login-spinner" role="status" aria-hidden="true"></span>
                <i class="bi bi-box-arrow-in-right me-1" id="login-icon" aria-hidden="true"></i>
                <span id="login-btn-text">Đăng nhập</span>
            </button>
        </div>

        <!-- Switch to Register Link -->
        <div class="text-center pt-2 border-top border-secondary-subtle">
            <p class="small text-secondary mb-0">
                Chưa có tài khoản sinh viên?
                <a th:href="@{/register}" href="/register" data-page="auth-register" data-action="navigate-register" class="fw-semibold text-primary">Đăng ký ngay</a>
            </p>
        </div>
    </form>
</div>
</body>
</html>
