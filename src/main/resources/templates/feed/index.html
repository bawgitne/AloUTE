<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/default :: layout(title='Bảng tin', content=~{::#feed-content})}">
<body>
<div id="feed-content">
    <h1 class="visually-hidden">Bảng tin AloUTE</h1>

    <!-- Single Visible Feed Create Post Entry: Clean Quick-Composer Card -->
    <section class="composer-box" aria-label="Tạo bài viết nhanh">
        <a th:href="@{/post/create}" href="/post/create" data-page="post-create" data-action="navigate-create-post" class="composer-card-link text-decoration-none d-flex align-items-center justify-content-between p-3 rounded" title="Soạn bài viết mới">
            <div class="d-flex align-items-center gap-3 flex-grow-1">
                <img th:src="${currentUser != null and currentUser.avatarUrl != null and !currentUser.avatarUrl.isEmpty()} ? ${currentUser.avatarUrl} : @{/images/avatar-fallback.svg}"
                     src="/images/avatar-fallback.svg"
                     alt="Avatar của bạn"
                     class="avatar-img avatar-sm"
                     width="40"
                     height="40">
                <div class="composer-text-block text-start">
                    <div class="fw-semibold text-primary d-flex align-items-center gap-2">
                        <i class="bi bi-pencil-square" aria-hidden="true"></i>
                        <span>Soạn bài viết</span>
                    </div>
                    <div class="composer-support-text text-muted small">
                        Chia sẻ tài liệu, thảo luận học tập hoặc tin tức HCMUTE...
                    </div>
                </div>
            </div>
            <i class="bi bi-chevron-right text-muted fs-5 ms-2" aria-hidden="true"></i>
        </a>
    </section>

    <!-- Activity Stream / Posts List -->
    <section aria-label="Danh sách bài viết" class="feed-posts-list">
        <!-- Feed Error State -->
        <div th:if="${feedError == true}" id="feed-error-state" class="alert alert-danger d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-2 p-3 my-3" role="alert">
            <div class="d-flex align-items-center gap-2">
                <i class="bi bi-exclamation-triangle-fill fs-5 text-danger" aria-hidden="true"></i>
                <span id="feed-error-message">Không thể tải bảng tin lúc này. Vui lòng thử lại sau.</span>
            </div>
            <a th:href="@{/feed}" href="/feed" class="btn btn-sm btn-outline-danger" id="btn-retry-feed">
                <i class="bi bi-arrow-clockwise me-1" aria-hidden="true"></i>
                <span>Thử lại</span>
            </a>
        </div>

        <!-- Feed Empty State (Clean helpful text, single primary composer above) -->
        <div th:if="${(feedError == null or !feedError) and (posts == null or #lists.isEmpty(posts))}" class="empty-state">
            <div class="empty-state-icon">
                <i class="bi bi-chat-square-dots" aria-hidden="true"></i>
            </div>
            <h2 class="empty-state-title">Chưa có bài viết nào</h2>
            <p class="empty-state-desc">Hãy là người đầu tiên chia sẻ thông tin, tài liệu học tập hoặc đặt câu hỏi trên AloUTE!</p>
        </div>

        <!-- Render Post Cards -->
        <div th:if="${(feedError == null or !feedError) and posts != null and !#lists.isEmpty(posts)}">
            <div th:each="postItem : ${posts}">
                <div th:replace="~{post/_post-card :: postCard(post=${postItem})}"></div>
            </div>

            <!-- Feed Pagination Component (Canonical /feed route) -->
            <div th:if="${pageMeta != null}">
                <div th:replace="~{fragments/pagination :: pagination(pageMeta=${pageMeta}, baseUrl='/feed')}"></div>
            </div>
        </div>
    </section>
</div>
</body>
</html>
