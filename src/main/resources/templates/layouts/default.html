<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head th:replace="~{fragments/head :: head(${title})}"></head>
<body class="aloute-body" th:attr="data-current-user-id=${currentUser != null and currentUser.id != null ? currentUser.id : ''}">
    <!-- Global Header / Navbar -->
    <header th:replace="~{fragments/navbar :: navbar}"></header>

    <!-- Main 3-Column Layout Container -->
    <div class="container-fluid aloute-layout-container">
        <div class="row g-4 justify-content-center">
            <!-- Left Panel: User Profile Summary & Navigation -->
            <aside class="col-md-4 col-lg-3 col-xl-3 d-none d-md-block aloute-left-panel" aria-label="Điều hướng">
                <div th:replace="~{fragments/sidebar :: sidebar}"></div>
            </aside>

            <!-- Center Panel: Activity Stream / Main Content -->
            <main class="col-12 col-md-8 col-lg-9 col-xl-6 aloute-feed-panel" id="main-content" role="main" tabindex="-1">
                <!-- Global Flash Feedback Notifications -->
                <div th:replace="~{fragments/flash :: flash}"></div>

                <!-- Page Content Slot -->
                <div th:replace="${content}"></div>
            </main>

            <!-- Right Panel: Community & Campus Information -->
            <aside class="col-xl-3 d-none d-xl-block aloute-right-panel" aria-label="Thông tin bổ sung">
                <div th:replace="~{fragments/info-card :: info-cards}"></div>
            </aside>
        </div>
    </div>

    <!-- Mobile Primary Navigation Offcanvas (Accessible drawer for <= 767px) -->
    <div class="offcanvas offcanvas-start d-md-none" tabindex="-1" id="mobileNavOffcanvas" aria-labelledby="mobileNavOffcanvasLabel">
        <div class="offcanvas-header border-bottom">
            <span class="offcanvas-title fw-bold fs-5" id="mobileNavOffcanvasLabel">Alo<span class="text-primary">UTE</span> <span class="badge-brand">Campus</span></span>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Đóng menu điều hướng"></button>
        </div>
        <div class="offcanvas-body">
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </div>
    </div>

    <!-- Global Modals (Post Edit / Delete) -->
    <div th:replace="~{fragments/modal :: postModals}"></div>

    <!-- Core Shared HTTP Transport Client -->
    <script th:src="@{/js/core/http-client.js}" src="/js/core/http-client.js" defer></script>
    <!-- Page Actions & Global Interactivity JS -->
    <script th:src="@{/js/page-actions.js}" src="/js/page-actions.js" defer></script>
    <!-- Post Interactions (Like, Bookmark, Repost) JS -->
    <script th:src="@{/js/features/post/post-like.js}" src="/js/features/post/post-like.js" defer></script>
    <!-- Post Edit & Delete JS -->
    <script th:src="@{/js/features/post/post-edit-delete.js}" src="/js/features/post/post-edit-delete.js" defer></script>
</body>
</html>
