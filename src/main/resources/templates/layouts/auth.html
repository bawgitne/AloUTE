<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head th:replace="~{fragments/head :: head(${title})}"></head>
<body class="aloute-auth-body">
    <main class="auth-container" role="main">
        <div class="auth-card">
            <!-- Brand Identity Header -->
            <div class="auth-brand text-center mb-3">
                <a th:href="@{/feed}" href="/feed" class="d-inline-flex flex-column align-items-center text-decoration-none mb-2">
                    <img th:src="@{/images/logo.png}" src="/images/logo.png" alt="AloUTE" width="56" height="56" class="rounded-3 shadow-xs mb-2">
                    <img th:src="@{/images/logo-text.png}" src="/images/logo-text.png" alt="AloUTE" height="26" class="d-inline-block">
                </a>
                <h1 class="auth-brand-title" th:text="${title}">Đăng nhập</h1>
                <p class="auth-brand-subtitle">Mạng xã hội học tập &amp; kết nối sinh viên UTE</p>
            </div>

            <!-- Global Flash Messages Area -->
            <div th:replace="~{fragments/flash :: flash}"></div>

            <!-- Page-Specific Auth Form Slot -->
            <div th:replace="${content}"></div>
        </div>
    </main>

    <!-- Auth Module JS -->
    <script th:src="@{/js/auth.js}" src="/js/auth.js" defer></script>
</body>
</html>
