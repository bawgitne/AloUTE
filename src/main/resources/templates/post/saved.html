<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/default :: layout(
        title='Bài viết đã lưu',
        content=~{::#saved-content}
      )}">
<body>
<div id="saved-content">
    <div class="mb-3 d-flex align-items-center justify-content-between">
        <div>
            <h1 class="fs-5 fw-bold mb-1 text-dark d-flex align-items-center gap-2">
                <i class="bi bi-bookmark-fill text-warning" aria-hidden="true"></i>
                <span>Bài viết đã lưu</span>
            </h1>
            <p class="small text-muted mb-0">Danh sách các bài viết và thảo luận bạn đã lưu lại để xem sau.</p>
        </div>
        <span class="badge bg-light text-secondary border rounded-pill px-3 py-2 small">
            <strong class="text-dark" th:text="${posts != null ? posts.size() : 0}">0</strong> bài viết
        </span>
    </div>

    <!-- Posts Stream -->
    <div th:if="${posts != null and !posts.isEmpty()}" class="d-flex flex-column gap-3">
        <th:block th:each="postItem : ${posts}">
            <div th:replace="~{post/_post-card :: postCard(post=${postItem})}"></div>
        </th:block>
    </div>

    <!-- Empty State -->
    <div th:if="${posts == null or posts.isEmpty()}" class="aloute-card text-center p-5 my-2">
        <div class="mb-3">
            <i class="bi bi-bookmark fs-1 text-warning" aria-hidden="true"></i>
        </div>
        <h2 class="fs-6 fw-bold mb-1">Chưa có bài viết nào được lưu</h2>
        <p class="small text-secondary mb-3">
            Bấm vào biểu tượng bookmark trên bài viết bất kỳ để lưu lại tại đây!
        </p>
        <a th:href="@{/feed}" class="btn btn-sm btn-primary rounded-pill px-3">
            <i class="bi bi-house-door me-1" aria-hidden="true"></i>Khám phá bài viết trên Bảng tin
        </a>
    </div>
</div>
</body>
</html>
