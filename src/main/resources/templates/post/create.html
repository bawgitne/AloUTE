<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/default :: layout(title='Tạo bài viết mới', content=~{::#create-post-content})}">
<body>
<div id="create-post-content">
    <div class="aloute-card p-3 p-md-4">
        <!-- Form Header -->
        <header class="d-flex align-items-center justify-content-between pb-3 mb-3 border-bottom border-secondary-subtle">
            <h1 class="fs-5 fw-bold mb-0 d-flex align-items-center gap-2">
                <i class="bi bi-pencil-square text-primary" aria-hidden="true"></i>
                <span>Tạo bài viết mới</span>
            </h1>
            <a th:href="@{/feed}" href="/feed" class="btn btn-sm btn-link text-muted text-decoration-none">
                <i class="bi bi-x-lg" aria-hidden="true"></i>
                <span class="visually-hidden">Đóng</span>
            </a>
        </header>

        <!-- Create Post Form using shared fragment -->
        <div th:replace="~{post/_composer-form :: composerForm(isModal=false)}"></div>
    </div>
</div>
</body>
</html>
