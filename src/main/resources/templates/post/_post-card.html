<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Reusable Post Card Fragment -->
<article th:fragment="postCard(post)" class="post-card" th:attr="data-post-id=${post != null ? post.id : ''},data-can-edit=${post != null and post.capabilities != null and post.capabilities.canEdit},data-can-delete=${post != null and post.capabilities != null and post.capabilities.canDelete}">
    <div th:if="${post != null}">
        <!-- Post Header: Author info, timestamp, capabilities dropdown -->
        <header class="post-card-header">
            <div class="post-author-meta d-flex align-items-center gap-2">
                <!-- Canonical /users/{id} route if author present, else fallback hook -->
                <a th:href="${post.author != null and post.author.id != null} ? @{/users/{id}(id=${post.author.id})} : '#'"
                   data-page="user-profile"
                   data-action="navigate-profile"
                   class="text-decoration-none">
                    <img th:src="${post.author != null and post.author.avatarUrl != null and !post.author.avatarUrl.isEmpty()} ? ${post.author.avatarUrl} : @{/images/avatar-fallback.svg}"
                         src="/images/avatar-fallback.svg"
                         alt="Avatar người đăng"
                         class="avatar-img avatar-sm"
                         width="40"
                         height="40">
                </a>
                <div>
                    <div class="d-flex align-items-center gap-1">
                        <a th:href="${post.author != null and post.author.id != null} ? @{/users/{id}(id=${post.author.id})} : '#'"
                           data-page="user-profile"
                           data-action="navigate-profile"
                           class="text-decoration-none text-reset">
                            <span class="post-author-name"
                                  th:text="${post.author != null ? (post.author.displayName != null ? post.author.displayName : post.author.username) : 'Sinh viên AloUTE'}">
                                Nguyễn Văn A
                            </span>
                        </a>
                        <i th:if="${post.author != null and post.author.isVerified}"
                           class="bi bi-patch-check-fill text-primary small"
                           aria-label="Tài khoản đã xác minh"></i>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <a th:if="${post.id != null}"
                           th:href="@{/posts/{postId}(postId=${post.id})}"
                           class="post-timestamp text-muted text-decoration-none"
                           th:text="${post.createdAt != null ? #temporals.format(post.createdAt.atZone(T(java.time.ZoneId).of('Asia/Ho_Chi_Minh')), 'dd/MM/yyyy HH:mm') : 'Vừa xong'}">10 phút trước</a>
                        <span th:if="${post.id == null}"
                              class="post-timestamp"
                              th:text="${post.createdAt != null ? #temporals.format(post.createdAt.atZone(T(java.time.ZoneId).of('Asia/Ho_Chi_Minh')), 'dd/MM/yyyy HH:mm') : 'Vừa xong'}">10 phút trước</span>
                        <span th:if="${post.visibility != null}" class="post-badge" th:text="${post.visibility}">PUBLIC</span>
                    </div>
                </div>
            </div>

            <!-- Post Actions Dropdown (Edit/Delete/Report hooks) -->
            <div th:if="${post.id != null}" class="dropdown">
                <button class="btn btn-link text-muted p-1"
                        type="button"
                        data-bs-toggle="dropdown"
                        aria-expanded="false"
                        aria-label="Thao tác bài viết">
                    <i class="bi bi-three-dots" aria-hidden="true"></i>
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow">
                    <li th:if="${post.capabilities != null and post.capabilities.canEdit}">
                        <button type="button"
                                class="dropdown-item d-flex align-items-center gap-2"
                                data-action="edit-post"
                                th:attr="data-post-id=${post.id}">
                            <i class="bi bi-pencil" aria-hidden="true"></i>
                            <span>Chỉnh sửa bài viết</span>
                        </button>
                    </li>
                    <li th:if="${post.capabilities != null and post.capabilities.canDelete}">
                        <button type="button"
                                class="dropdown-item text-danger d-flex align-items-center gap-2"
                                data-action="delete-post"
                                th:attr="data-post-id=${post.id}">
                            <i class="bi bi-trash" aria-hidden="true"></i>
                            <span>Xóa bài viết</span>
                        </button>
                    </li>
                    <li>
                        <button type="button"
                                class="dropdown-item text-danger d-flex align-items-center gap-2"
                                data-action="open-report-modal"
                                data-report-type="post"
                                th:attr="data-reported-id=${post.id}, data-reported-name=${post.author != null ? (post.author.displayName ?: post.author.username) : 'Bài viết'}">
                            <i class="bi bi-flag" aria-hidden="true"></i>
                            <span>Báo cáo bài viết</span>
                        </button>
                    </li>
                </ul>
            </div>
        </header>

        <!-- Post Content (Escaped output) -->
        <div class="post-card-content">
            <p class="mb-2" th:text="${post.content}">Nội dung bài viết mẫu trên diễn đàn AloUTE.</p>
        </div>

        <!-- Post Media Gallery (if present) -->
        <div th:if="${post.media != null and !post.media.isEmpty()}" class="post-media-container">
            <div th:each="mediaItem : ${post.media}" class="mb-2 last-mb-0">
                <img th:if="${mediaItem.type == null or mediaItem.type.toString() == 'IMAGE'}"
                     th:src="${mediaItem.url}"
                     alt="Hình ảnh đính kèm bài viết"
                     class="post-media-img"
                     loading="lazy">
                <img th:if="${mediaItem.type != null and mediaItem.type.toString() == 'GIF'}"
                     th:src="${mediaItem.url}"
                     alt="Ảnh GIF đính kèm bài viết"
                     class="post-media-img"
                     loading="lazy">
                <video th:if="${mediaItem.type != null and mediaItem.type.toString() == 'VIDEO'}"
                       th:src="${mediaItem.url}"
                       controls
                       preload="metadata"
                       class="post-media-img"
                       style="max-height: 480px; width: 100%; object-fit: contain; background: #000;">
                    Trình duyệt của bạn không hỗ trợ thẻ video.
                </video>
            </div>
        </div>

        <!-- Poll Widget (if present) -->
        <div th:if="${post.poll != null}"
             th:with="isPollClosed=${(post.poll.closesAt != null and post.poll.closesAt.isBefore(T(java.time.Instant).now())) or (post.poll.expiresAt != null and post.poll.expiresAt.isBefore(T(java.time.Instant).now()))}"
             class="post-poll-container border rounded-3 p-3 my-2 bg-light-subtle"
             th:attr="data-poll-id=${post.poll.id}, data-allow-multiple=${post.poll.allowMultiple}, data-is-closed=${isPollClosed}">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h3 class="fs-6 fw-bold mb-0 text-dark d-flex align-items-center gap-2">
                    <i class="bi bi-bar-chart-line-fill text-primary" aria-hidden="true"></i>
                    <span th:text="${post.poll.question}">Bình chọn</span>
                </h3>
                <span th:if="${isPollClosed}" class="badge bg-secondary-subtle text-secondary small">
                    Đã kết thúc
                </span>
            </div>

            <!-- Voted or Closed State: Display Result Progress Bars -->
            <div th:if="${isPollClosed or post.poll.userVotedOptionId != null or (post.poll.options != null and #lists.size(post.poll.options.?[selectedByCurrentUser == true]) > 0)}"
                 class="poll-results d-flex flex-column gap-2">
                <div th:each="opt : ${post.poll.options}" class="poll-option-result position-relative border rounded-2 p-2 overflow-hidden bg-white">
                    <!-- Progress Fill Bar -->
                    <div class="poll-progress-bg position-absolute top-0 start-0 h-100"
                         th:style="'width: ' + (${post.poll.totalVotes > 0} ? ${opt.voteCount * 100 / post.poll.totalVotes} : 0) + '%; background-color: rgba(37, 99, 235, 0.12); z-index: 0;'"></div>
                    <div class="position-relative d-flex justify-content-between align-items-center" style="z-index: 1;">
                        <div class="d-flex align-items-center gap-2">
                            <i th:if="${opt.selectedByCurrentUser == true or opt.id == post.poll.userVotedOptionId}"
                               class="bi bi-check-circle-fill text-primary" aria-label="Lựa chọn của bạn"></i>
                            <span class="small fw-medium text-dark" th:text="${opt.text}">Lựa chọn</span>
                        </div>
                        <div class="small text-muted d-flex align-items-center gap-2">
                            <span th:text="(${post.poll.totalVotes > 0} ? ${opt.voteCount * 100 / post.poll.totalVotes} : 0) + '%'">0%</span>
                            <span th:text="'(' + ${opt.voteCount} + ')'"> (0)</span>
                        </div>
                    </div>
                </div>
                <div class="d-flex justify-content-between align-items-center small text-muted mt-1">
                    <span th:text="${post.poll.totalVotes} + ' lượt bình chọn'">0 lượt bình chọn</span>
                    <span th:if="${post.poll.allowMultiple}" class="fst-italic">Nhiều lựa chọn</span>
                </div>
            </div>

            <!-- Not Voted and Open State: Display Voting Form -->
            <form th:if="${!isPollClosed and post.poll.userVotedOptionId == null and (post.poll.options == null or #lists.size(post.poll.options.?[selectedByCurrentUser == true]) == 0)}"
                  class="poll-vote-form d-flex flex-column gap-2"
                  th:attr="data-poll-id=${post.poll.id}, data-allow-multiple=${post.poll.allowMultiple}">
                <div th:each="opt : ${post.poll.options}" class="form-check border rounded-2 p-2 ps-4 bg-white m-0">
                    <input th:if="${!post.poll.allowMultiple}"
                           class="form-check-input"
                           type="radio"
                           th:name="'poll-opt-' + ${post.poll.id}"
                           th:id="'opt-' + ${opt.id}"
                           th:value="${opt.id}" required>
                    <input th:if="${post.poll.allowMultiple}"
                           class="form-check-input"
                           type="checkbox"
                           th:name="'poll-opt-' + ${post.poll.id}"
                           th:id="'opt-' + ${opt.id}"
                           th:value="${opt.id}">
                    <label class="form-check-label small fw-medium text-dark w-100 cursor-pointer"
                           th:for="'opt-' + ${opt.id}"
                           th:text="${opt.text}">Lựa chọn</label>
                </div>
                <div class="d-flex justify-content-between align-items-center mt-2">
                    <span class="small text-muted" th:text="${post.poll.totalVotes} + ' lượt bình chọn'">0 lượt bình chọn</span>
                    <button type="submit" class="btn btn-sm btn-outline-primary rounded-pill px-3 btn-vote-poll">
                        <span class="spinner-border spinner-border-sm d-none me-1" role="status" aria-hidden="true"></span>
                        <span>Bình chọn</span>
                    </button>
                </div>
                <div class="poll-vote-error alert alert-danger py-1 px-2 small d-none mb-0 mt-1" role="alert"></div>
            </form>
        </div>

        <!-- Post Topics / Tags (Non-interactive reference tags) -->
        <div th:if="${post.topics != null and !post.topics.isEmpty()}" class="post-topics">
            <span th:each="topic : ${post.topics}"
                  class="badge bg-light text-secondary border rounded-pill py-1 px-2"
                  th:text="'#' + ${topic.name}">#hoc-tap</span>
        </div>

        <!-- Post Interaction Controls Fragment -->
        <footer class="post-card-footer mt-2">
            <div th:replace="~{post/_interaction-bar :: interactionBar(post=${post})}"></div>
        </footer>
    </div>
</article>
</body>
</html>
