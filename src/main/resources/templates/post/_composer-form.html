<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="composerForm(isModal)">
    <form id="create-post-form" class="needs-validation" novalidate>
        <!-- Community Context (optional) -->
        <input type="hidden" id="post-community-id" name="communityId" th:value="${communityId != null ? communityId : ''}" value="">

        <!-- Status Alert for feedback -->
        <div id="create-post-status" class="alert d-none mb-3" role="status" aria-live="polite"></div>

        <!-- Content Field -->
        <div class="mb-3">
            <label for="postContent" class="form-label fw-semibold small">Nội dung bài viết <span class="text-danger">*</span></label>
            <textarea class="form-control"
                      id="postContent"
                      name="content"
                      rows="5"
                      placeholder="Chia sẻ thảo luận học tập, câu hỏi chuyên ngành, hoặc thông tin sinh viên..."
                      required
                      maxlength="2000"
                      th:text="${postForm != null ? postForm.content : ''}"></textarea>
            <div class="d-flex justify-content-between align-items-center mt-1">
                <div class="form-text small text-muted">Hỗ trợ tối đa 2000 ký tự. Vui lòng tuân thủ văn hóa AloUTE.</div>
                <div class="text-muted small" id="char-count">0 / 2000</div>
            </div>
            <div th:if="${fieldErrors != null and fieldErrors.content != null}"
                 class="invalid-feedback d-block"
                 th:text="${fieldErrors.content}">
                Nội dung không được để trống.
            </div>
            <div id="post-content-error" class="invalid-feedback d-none">
                Nội dung không được để trống.
            </div>
        </div>

        <!-- Visibility Selection (OpenAPI: PUBLIC, FOLLOWERS, MENTIONED) -->
        <div class="mb-3">
            <label for="visibility" class="form-label fw-semibold small">Phạm vi hiển thị</label>
            <select class="form-select" id="visibility" name="visibility">
                <option value="PUBLIC" selected>Công khai (Toàn bộ sinh viên AloUTE)</option>
                <option value="FOLLOWERS">Người theo dõi (Chỉ người theo dõi bạn)</option>
                <option value="MENTIONED">Chỉ người được nhắc đến</option>
            </select>
        </div>

        <!-- Topic Tags (optional, CreatePostRequest.topicIds) -->
        <div class="mb-3" id="post-topic-picker">
            <div class="d-flex align-items-center justify-content-between gap-2 mb-2">
                <label for="topic-search" class="form-label fw-semibold small mb-0">
                    Chủ đề <span class="text-muted fw-normal">(không bắt buộc)</span>
                </label>
                <span class="small text-muted" id="topic-selection-count" aria-live="polite">Chưa chọn chủ đề</span>
            </div>
            <div id="selected-topics" class="d-flex flex-wrap gap-2 mb-2" role="group" aria-label="Chủ đề đã chọn"></div>
            <div class="input-group input-group-sm">
                <span class="input-group-text bg-white border-end-0"><i class="bi bi-hash text-secondary" aria-hidden="true"></i></span>
                <input type="search" class="form-control border-start-0" id="topic-search"
                       placeholder="Tìm chủ đề theo tên..." autocomplete="off" maxlength="100"
                       aria-describedby="topic-picker-status">
            </div>
            <div id="topic-results" class="list-group list-group-flush border rounded-2 mt-2 d-none"
                 role="group" aria-label="Kết quả tìm kiếm chủ đề"
                 style="max-height: 220px; overflow-y: auto;"></div>
            <div class="d-flex align-items-center gap-2 mt-1">
                <span class="form-text small mb-0" id="topic-picker-status" role="status" aria-live="polite">
                    Gắn chủ đề giúp bài viết tiếp cận đúng người quan tâm.
                </span>
                <button type="button" class="btn btn-link btn-sm p-0 d-none" id="topic-retry">Thử lại</button>
            </div>
        </div>

        <!-- Media Attachments (Supported via POST /api/media) -->
        <div class="mb-3">
            <div class="d-flex align-items-center justify-content-between mb-2">
                <span class="form-label fw-semibold small mb-0">Hình ảnh / Video đính kèm</span>
                <button type="button" id="btn-select-media" class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-1">
                    <i class="bi bi-paperclip" aria-hidden="true"></i>
                    <span>Thêm ảnh/video</span>
                </button>
                <input type="file" id="post-media-input" accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/webm,video/quicktime" multiple class="d-none">
            </div>
            <div id="media-preview-list" class="d-flex flex-wrap gap-2"></div>
            <div id="media-upload-status" class="alert alert-danger py-1 px-2 small d-none mt-2" role="alert"></div>
        </div>

        <!-- Poll Builder (optional, POST /api/posts with CreatePostRequest.poll) -->
        <div class="mb-3">
            <div class="d-flex align-items-center justify-content-between mb-2">
                <span class="form-label fw-semibold small mb-0">Bình chọn</span>
                <button type="button" id="btn-toggle-poll" class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-1" aria-pressed="false" aria-controls="poll-builder">
                    <i class="bi bi-bar-chart-line" aria-hidden="true"></i>
                    <span>Thêm bình chọn</span>
                </button>
            </div>
            <div id="poll-builder" class="p-3 rounded bg-light-subtle border d-none">
                <div id="poll-builder-status" class="alert alert-danger py-1 px-2 small d-none mb-2" role="alert"></div>
                <div class="mb-2">
                    <label for="poll-question" class="form-label small fw-semibold mb-1">Câu hỏi bình chọn <span class="text-danger">*</span></label>
                    <input type="text" class="form-control form-control-sm" id="poll-question" maxlength="255" placeholder="Ví dụ: Chủ đề nào bạn thích nhất trong CNPM?">
                </div>
                <div id="poll-options-list" class="d-flex flex-column gap-2 mb-2">
                    <div class="poll-option-row input-group input-group-sm">
                        <span class="input-group-text">1</span>
                        <input type="text" class="form-control poll-option-input" maxlength="200" placeholder="Phương án 1">
                        <button type="button" class="btn btn-outline-secondary poll-option-remove d-none" aria-label="Xóa phương án 1" tabindex="-1"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
                    </div>
                    <div class="poll-option-row input-group input-group-sm">
                        <span class="input-group-text">2</span>
                        <input type="text" class="form-control poll-option-input" maxlength="200" placeholder="Phương án 2">
                        <button type="button" class="btn btn-outline-secondary poll-option-remove d-none" aria-label="Xóa phương án 2" tabindex="-1"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
                    </div>
                </div>
                <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
                    <button type="button" id="btn-add-poll-option" class="btn btn-sm btn-outline-primary d-flex align-items-center gap-1">
                        <i class="bi bi-plus-lg" aria-hidden="true"></i><span>Thêm phương án</span>
                    </button>
                    <span class="text-muted small" id="poll-option-count">2 / 10 phương án</span>
                </div>
                <div class="d-flex flex-wrap gap-3 mt-3 pt-2 border-top">
                    <div class="form-check form-switch mb-0">
                        <input class="form-check-input" type="checkbox" id="poll-allow-multiple">
                        <label class="form-check-label small text-secondary" for="poll-allow-multiple">Cho phép chọn nhiều phương án</label>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <label for="poll-duration" class="small text-secondary mb-0">Thời hạn:</label>
                        <select class="form-select form-select-sm w-auto" id="poll-duration">
                            <option value="" selected>Không giới hạn</option>
                            <option value="1">1 ngày</option>
                            <option value="3">3 ngày</option>
                            <option value="7">7 ngày</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- Interaction Permissions (allowReply, allowQuote) -->
        <div class="mb-4 p-3 rounded post-permissions-panel bg-light-subtle border">
            <div class="form-label fw-semibold small mb-2">Quyền tương tác</div>
            <div class="form-check form-switch mb-2">
                <input class="form-check-input" type="checkbox" id="allowReply" name="allowReply" value="true" checked>
                <label class="form-check-label text-secondary small" for="allowReply">
                    Cho phép người khác bình luận vào bài viết
                </label>
            </div>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="allowQuote" name="allowQuote" value="true" checked>
                <label class="form-check-label text-secondary small" for="allowQuote">
                    Cho phép người khác trích dẫn bài viết này
                </label>
            </div>
        </div>

        <!-- Form Actions -->
        <div class="d-flex align-items-center justify-content-end gap-2 pt-2 border-top border-secondary-subtle">
            <button th:if="${isModal}" type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="btn-cancel-create-post">Hủy bỏ</button>
            <a th:unless="${isModal}" th:href="@{/feed}" href="/feed" class="btn btn-secondary">Hủy bỏ</a>
            <button type="submit" id="btn-create-post" class="btn btn-primary px-4 fw-semibold" data-action="create-post"
                    th:disabled="${postForm == null or postForm.content == null or #strings.isEmpty(#strings.trim(postForm.content))}"
                    disabled>
                <i class="bi bi-send me-1" aria-hidden="true"></i>
                <span>Đăng bài</span>
            </button>
        </div>
    </form>
</div>
</body>
</html>
