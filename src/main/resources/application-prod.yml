spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/aloutedb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:aloute_user}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

  sql:
    init:
      mode: never

  thymeleaf:
    cache: true
    mode: HTML
    encoding: UTF-8

server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      protocol-header: X-Forwarded-Proto
      remote-ip-header: X-Forwarded-For
      internal-proxies: 10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|169\.254\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2[0-9]|3[0-1])\.\d{1,3}\.\d{1,3}|::1|[0:]{3,39}1

aloute:
  production-mode: ${ALOUTE_PRODUCTION_MODE:true}
  firebase:
    enabled: ${ALOUTE_FIREBASE_ENABLED:true}
    bucket: ${ALOUTE_FIREBASE_BUCKET:cnpm-f1a39.firebasestorage.app}
    credentials-path: ${ALOUTE_FIREBASE_CREDENTIALS_PATH:}
  auth:
    registration-otp-secret: ${ALOUTE_REGISTRATION_OTP_SECRET}
  mail:
    host: ${ALOUTE_MAIL_HOST:smtp.gmail.com}
    port: ${ALOUTE_MAIL_PORT:587}
    username: ${ALOUTE_MAIL_USERNAME:}
    password: ${ALOUTE_MAIL_PASSWORD:}
    from: ${ALOUTE_MAIL_FROM:no-reply@aloute.local}
    starttls:
      enable: true
    ssl:
      checkserveridentity: true

ALOUTE_JWT_SECRET: ${ALOUTE_JWT_SECRET}
ALOUTE_JWT_EXPIRATION_SECONDS: ${ALOUTE_JWT_EXPIRATION_SECONDS:86400}
