spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/aloutedb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:aloute_user}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

  sql:
    init:
      mode: never

  thymeleaf:
    cache: true
    mode: HTML
    encoding: UTF-8

aloute:
  firebase:
    enabled: ${ALOUTE_FIREBASE_ENABLED:true}
    bucket: ${ALOUTE_FIREBASE_BUCKET:cnpm-f1a39.firebasestorage.app}
    credentials-path: ${ALOUTE_FIREBASE_CREDENTIALS_PATH:}

ALOUTE_JWT_SECRET: ${ALOUTE_JWT_SECRET}
ALOUTE_JWT_EXPIRATION_SECONDS: ${ALOUTE_JWT_EXPIRATION_SECONDS:86400}
