spring:
  application:
    name: aloute
  profiles:
    active: prod
  servlet:
    multipart:
      max-file-size: 35MB
      max-request-size: 40MB
  web:
    resources:
      cache:
        # Static assets under /css /js /images are content-hash versioned (see
        # chain below), so a new release with changed files produces new URLs
        # and users never see stale assets within the 12h TTL window.
        period: 12h
      chain:
        strategy:
          content:
            # Appends ?v=<content-hash> to asset URLs resolved through
            # Thymeleaf @{...} links (via ResourceUrlEncodingFilter). Manual
            # ?v=N bumps in templates stay harmless as extra query params.
            enabled: true

server:
  port: ${PORT:8080}
  tomcat:
    max-swallow-size: 45MB
  compression:
    # The realtime client uses a raw WebSocket to /ws (not HTTP streaming), so
    # compressing these HTTP responses does not affect STOMP delivery.
    enabled: true
    min-response-size: 2048
    mime-types: text/html, text/xml, text/plain, text/css, text/javascript, application/javascript, application/json, application/xml, image/svg+xml
