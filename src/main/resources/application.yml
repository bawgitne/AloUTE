spring:
  application:
    name: aloute
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 35MB
      max-request-size: 40MB
  web:
    resources:
      cache:
        # Immutable-ish static assets under /css /js /images are versioned via
        # explicit ?v=N cache-busters in the templates; a moderate TTL bounds
        # staleness for entries whose ?v=N was not bumped on a deploy.
        period: 12h

server:
  port: ${PORT:8080}
  tomcat:
    max-swallow-size: 45MB
  compression:
    # The realtime client uses a raw WebSocket to /ws (not HTTP streaming), so
    # compressing these HTTP responses does not affect STOMP delivery.
    enabled: true
    min-response-size: 2048
    mime-types: text/html, text/xml, text/plain, text/css, text/javascript, application/javascript, application/json, application/xml, image/svg+xml
