# MySQL 8 integration profile (test classpath only).
#
# Activated together with the dev profile so the media/seed beans are present while the
# datasource is switched from H2 to a disposable MySQL 8:
#     mvn -Dtest=SystemAdminInvariantIntegrationTest,MysqlDialectVerificationTest \
#         test -Dspring.profiles.active=dev,mysqlit -Daloute.it.mysql=true
#
# This lets the "at least one active SYSTEM_ADMIN" pessimistic-lock invariant be verified
# on a real InnoDB engine (row-level locking, real deadlock/timeout behaviour) instead of
# only on H2. The database is a throwaway CI database — never production.
spring.datasource.url=${ALOUTE_IT_MYSQL_URL:jdbc:mysql://127.0.0.1:3306/aloute_it?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${ALOUTE_IT_MYSQL_USER:aloute}
spring.datasource.password=${ALOUTE_IT_MYSQL_PASSWORD:aloute}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
