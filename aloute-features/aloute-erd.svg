  <path class="rel" d="M 350 615 C 620 615, 1060 390, 1330 390"/>
  <text class="label" x="1010" y="410">1 - N</text>

  <path class="rel" d="M 350 650 C 650 650, 1040 570, 1330 570"/>
  <text class="label" x="1010" y="555">1 - N</text>

  <path class="rel" d="M 350 690 C 650 690, 1040 730, 1330 730"/>
  <text class="label" x="1010" y="710">1 - N</text>

  <path class="rel-soft" d="M 1190 1020 C 1270 1020, 1270 1085, 1330 1085"/>
  <text class="label" x="1230" y="1062">N - 1</text>

  <!-- USERS -->
  <g transform="translate(70 130)">
    <rect class="entity" x="0" y="0" width="280" height="610"/>
    <rect class="head" x="0" y="0" width="280" height="42"/>
    <text class="name" x="18" y="27">USERS</text>
    <text class="pk" x="18" y="72">PK id</text>
    <text class="field" x="18" y="102">email UK</text>
    <text class="field" x="18" y="132">username UK</text>
    <text class="field" x="18" y="162">password_hash</text>
    <text class="field" x="18" y="192">status</text>
    <text class="field" x="18" y="222">email_verified_at</text>
    <text class="field" x="18" y="252">created_at</text>
    <text class="field" x="18" y="282">updated_at</text>
    <text class="field" x="18" y="312">deleted_at</text>
    <text class="fk" x="18" y="342">FK deleted_by</text>
    <text class="field" x="18" y="386">Self-reference qua:</text>
    <text class="fk" x="18" y="416">friend_requests</text>
    <text class="fk" x="18" y="446">friendships</text>
    <text class="fk" x="18" y="476">follows</text>
    <text class="fk" x="18" y="506">blocks</text>
    <text class="field" x="18" y="550">Quan hệ chính:</text>
    <text class="field" x="18" y="580">profile, post, group, chat</text>
  </g>

  <!-- USER PROFILE -->
