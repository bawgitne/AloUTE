<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #475569; }
      .entity { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 12; }
      .head { fill: #dbeafe; stroke: #334155; stroke-width: 2; }
      .head-green { fill: #dcfce7; stroke: #334155; stroke-width: 2; }
      .head-orange { fill: #ffedd5; stroke: #334155; stroke-width: 2; }
      .head-purple { fill: #f3e8ff; stroke: #334155; stroke-width: 2; }
      .name { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .field { font: 15px Consolas, monospace; fill: #1e293b; }
      .pk { font: 700 15px Consolas, monospace; fill: #b91c1c; }
      .fk { font: 700 15px Consolas, monospace; fill: #1d4ed8; }
      .rel { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .rel-soft { stroke: #94a3b8; stroke-width: 1.8; fill: none; marker-end: url(#arrow-soft); }
      .label { font: 700 14px Arial, sans-serif; fill: #0f172a; paint-order: stroke; stroke: #f8fafc; stroke-width: 4; }
      .legend { font: 16px Arial, sans-serif; fill: #334155; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1250"/>
  <text class="title" x="70" y="58">ERD CSDL ALOUTE - Mạng xã hội</text>
  <text class="subtitle" x="70" y="88">PK màu đỏ, FK màu xanh. Các bảng trung gian biểu diễn quan hệ N-N.</text>

