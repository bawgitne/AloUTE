  <path class="rel" d="M 790 1010 C 860 1010, 860 1110, 920 1110"/>
  <text class="label" x="838" y="1080">1 - N</text>

  <path class="rel" d="M 790 940 C 1010 940, 1010 970, 1330 970"/>
