  <path class="rel" d="M 350 255 C 430 255, 430 170, 520 170"/>
  <text class="label" x="410" y="230">1 - 1</text>

  <path class="rel" d="M 350 300 C 435 300, 435 325, 520 325"/>
  <text class="label" x="410" y="305">1 - N</text>

  <path class="rel" d="M 350 355 C 425 355, 425 510, 520 510"/>
  <text class="label" x="410" y="465">1 - N</text>

  <path class="rel" d="M 350 430 C 420 430, 420 700, 520 700"/>
  <text class="label" x="395" y="660">1 - N</text>

  <path class="rel" d="M 350 510 C 420 510, 420 915, 520 915"/>
