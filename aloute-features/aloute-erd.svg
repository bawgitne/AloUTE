  <!-- Legend -->
  <g transform="translate(70 785)">
    <rect class="entity" x="0" y="0" width="280" height="250"/>
    <rect class="head" x="0" y="0" width="280" height="42"/>
    <text class="name" x="18" y="27">Ghi nhớ khi vẽ</text>
    <text class="legend" x="18" y="72">1. USERS là bảng trung tâm.</text>
    <text class="legend" x="18" y="102">2. N-N cần bảng nối.</text>
    <text class="legend" x="18" y="132">3. Comment tự tham chiếu.</text>
    <text class="legend" x="18" y="162">4. Follow/block/friend là</text>
    <text class="legend" x="36" y="188">self-reference User-User.</text>
    <text class="legend" x="18" y="218">5. Soft delete dùng deleted_at.</text>
