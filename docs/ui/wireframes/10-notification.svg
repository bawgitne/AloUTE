      <rect x="975" y="277" width="85" height="28" class="btn-secondary" />
      <text x="1017" y="295" class="btn-secondary-text" font-size="11px">View Reply</text>

      <!-- Item 3: UNREAD COMMUNITY ACTIVITY -->
      <rect x="320" y="340" width="760" height="75" class="card-active" />
      <line x1="320" y1="340" x2="320" y2="415" stroke="#3B82F6" stroke-width="4" />
      <circle cx="345" cy="377" r="5" fill="#3B82F6" />

      <circle cx="375" cy="377" r="18" class="avatar-box" />
      <text x="375" y="381" class="avatar-text">SE</text>

      <text x="405" y="370" class="text-body"><tspan font-weight="700" fill="#F8FAFC">CLB Phần Mềm (SE Club)</tspan> posted a new announcement: &quot;Đăng ký tham gia Hackathon 2026&quot;</text>
