      <circle cx="375" cy="547" r="18" class="avatar-box" />
      <text x="375" y="551" class="avatar-text">NN</text>

      <text x="405" y="540" class="text-body"><tspan font-weight="700" fill="#F8FAFC">TS. Nguyễn Duy Ngọc</tspan> liked your post: &quot;Tổng hợp tài liệu kiến trúc Spring Boot 3&quot;</text>
