<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .meta-bar { fill: #030712; }
      .meta-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #F8FAFC; font-weight: 600; }
      .meta-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #64748B; }
      .nav-bg { fill: #111827; stroke: #1F2937; stroke-width: 1; }
      .brand-title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 800; fill: #3B82F6; }
      .card { fill: #131B2A; stroke: #233148; stroke-width: 1.5; rx: 8px; }
      .card-subtle { fill: #0F172A; stroke: #1E293B; stroke-width: 1; rx: 6px; }
      .card-hover { fill: #1A2438; stroke: #2A3A55; stroke-width: 1; rx: 6px; }
      .card-active { fill: #172554; stroke: #2563EB; stroke-width: 1.5; rx: 6px; }
      .text-title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #F8FAFC; }
      .text-section { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: #E2E8F0; }
      .text-body { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 400; fill: #CBD5E1; }
      .text-bold { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #F8FAFC; }
      .text-muted { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 400; fill: #94A3B8; }
      .text-small { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 400; fill: #64748B; }
      .btn-primary { fill: #2563EB; stroke: #1D4ED8; stroke-width: 1; rx: 6px; }
      .btn-primary-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #FFFFFF; text-anchor: middle; }
      .btn-secondary { fill: #1E293B; stroke: #334155; stroke-width: 1; rx: 6px; }
      .btn-secondary-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #CBD5E1; text-anchor: middle; }
      .btn-accent { fill: #3B82F6; stroke: #2563EB; stroke-width: 1; rx: 6px; }
      .btn-accent-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #FFFFFF; text-anchor: middle; }
      .btn-danger { fill: #450A0A; stroke: #991B1B; stroke-width: 1; rx: 6px; }
      .btn-danger-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #FCA5A5; text-anchor: middle; }
      .badge-wire { fill: #1E293B; stroke: #334155; stroke-width: 1; rx: 4px; }
      .badge-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #94A3B8; text-anchor: middle; }
      .badge-role { fill: #1E3A8A; stroke: #3B82F6; stroke-width: 1; rx: 4px; }
      .badge-role-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #93C5FD; text-anchor: middle; }
      .input-box { fill: #0B0F19; stroke: #334155; stroke-width: 1.5; rx: 6px; }
      .input-bg { fill: #0F172A; stroke: #1E293B; stroke-width: 1; rx: 6px; }
      .input-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #F1F5F9; }
      .input-placeholder { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #64748B; }
      .avatar-box { fill: #1E293B; stroke: #475569; stroke-width: 1.5; }
      .avatar-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #E2E8F0; text-anchor: middle; }
      .media-ph { fill: #0F172A; stroke: #334155; stroke-width: 1.5; stroke-dasharray: 4,4; rx: 6px; }
      .media-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #94A3B8; text-anchor: middle; }
      .alert-error { fill: #2D1214; stroke: #7F1D1D; stroke-width: 1.5; rx: 6px; }
      .alert-error-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 500; fill: #FCA5A5; }
      .alert-info { fill: #0C1E3A; stroke: #1E40AF; stroke-width: 1.5; rx: 6px; }
      .alert-info-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 500; fill: #93C5FD; }
      .footer-bar { fill: #030712; stroke: #1F2937; stroke-width: 1; }
      .footer-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 500; fill: #64748B; }
    </style>
  </defs>

  <rect x="0" y="0" width="1440" height="900" class="bg" />

  <!-- Top Metadata Bar -->
  <rect x="0" y="0" width="1440" height="38" class="meta-bar" />
  <text x="24" y="24" class="meta-text">AloUTE WIREFRAME [09-messaging] — 1-TO-1 DIRECT MESSAGING</text>
  <text x="1416" y="24" class="meta-sub" text-anchor="end">Owner: Phạm Minh Quân  •  Week 1 UI Design Evidence  •  Dark University Theme  •  1440×900</text>



    <!-- Global Navbar (Y: 38 - 92) -->
    <rect x="0" y="38" width="1440" height="54" class="nav-bg" />
    <text x="40" y="72" class="brand-title">AloUTE</text>
    <rect x="125" y="58" width="70" height="20" class="badge-wire" />
    <text x="160" y="72" class="badge-text">HCMUTE</text>
    <text x="205" y="72" class="text-muted">University Social Network</text>

    <!-- Global Search -->
    <rect x="800" y="50" width="360" height="32" class="input-bg" />
    <text x="815" y="71" class="input-placeholder">🔍 Search posts, people, communities...</text>

    <!-- Nav Items -->

        <text x="360" y="70" font-family="system-ui, sans-serif" font-size="14px" font-weight="500" fill="#94A3B8">Home</text>

        <text x="440" y="70" font-family="system-ui, sans-serif" font-size="14px" font-weight="500" fill="#94A3B8">Community</text>

        <text x="550" y="70" font-family="system-ui, sans-serif" font-size="14px" font-weight="700" fill="#3B82F6">Messages</text>
        <line x1="550" y1="88" x2="622" y2="88" stroke="#3B82F6" stroke-width="2"/>
        <text x="655" y="70" font-family="system-ui, sans-serif" font-size="14px" font-weight="500" fill="#94A3B8">Notifications</text>


    <!-- Notification Badge -->
    <circle cx="760" cy="62" r="8" fill="#EF4444" />
    <text x="760" y="66" font-family="system-ui, sans-serif" font-size="10px" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>

    <!-- User Profile Chip -->
    <rect x="1200" y="47" width="200" height="36" class="card-subtle" rx="18" />
    <circle cx="1220" cy="65" r="14" class="avatar-box" />
    <text x="1220" y="69" class="avatar-text">MQ</text>
    <text x="1242" y="69" class="text-bold">Minh Quân</text>
    <text x="1380" y="69" class="text-muted">▼</text>

    <!-- 2-COLUMN 1-TO-1 MESSAGING WORKSPACE (Y: 105 to 845) -->

    <!-- LEFT PANEL: Conversation Search & List (X: 40, Y: 105, Width: 380, Height: 740) -->
    <g id="conversation-list-panel">
      <rect x="40" y="105" width="380" height="740" class="card" />

      <!-- Header -->
      <text x="60" y="138" class="text-title" font-size="18px">Direct Messages</text>
      <text x="395" y="138" class="text-muted" font-size="12px" text-anchor="end">1-to-1 Chat</text>

      <!-- Search Input -->
      <rect x="55" y="155" width="350" height="36" class="input-bg" />
      <text x="70" y="178" class="input-placeholder">🔍 Search conversations or students...</text>
      <line x1="40" y1="202" x2="420" y2="202" stroke="#233148" />

      <!-- Conversation Item 1 (ACTIVE / SELECTED) -->
      <rect x="45" y="210" width="370" height="75" class="card-active" />
      <line x1="45" y1="210" x2="45" y2="285" stroke="#3B82F6" stroke-width="4" />
      <circle cx="80" cy="247" r="20" class="avatar-box" />
      <text x="80" y="252" class="avatar-text">NB</text>
      <circle cx="95" cy="260" r="5" fill="#10B981" stroke="#131B2A" stroke-width="1.5" />
      <text x="110" y="240" class="text-bold">Nguyễn Văn B</text>
      <text x="395" y="240" class="text-muted" font-size="11px" text-anchor="end">10:24 AM</text>
      <text x="110" y="260" class="text-body" font-size="12px">Thầy đã duyệt tài liệu kiến trúc chưa Quân?</text>

      <!-- Conversation Item 2 (UNREAD) -->
      <rect x="45" y="295" width="370" height="75" class="card-hover" />
      <circle cx="80" cy="332" r="20" class="avatar-box" />
      <text x="80" y="337" class="avatar-text">AB</text>
      <text x="110" y="325" class="text-bold">Ngô Anh Bằng</text>
      <text x="395" y="325" class="text-muted" font-size="11px" text-anchor="end">09:12 AM</text>
      <text x="110" y="345" class="text-body" font-size="12px">Mình vừa update 2 sequence diagrams nhé...</text>
      <circle cx="390" cy="345" r="8" fill="#2563EB" />
      <text x="390" y="349" font-family="system-ui, sans-serif" font-size="10px" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>

      <!-- Conversation Item 3 -->
      <rect x="45" y="380" width="370" height="75" class="card-subtle" />
      <circle cx="80" cy="417" r="20" class="avatar-box" />
      <text x="80" y="422" class="avatar-text">TC</text>
      <text x="110" y="410" class="text-bold">Trần Thị C</text>
      <text x="395" y="410" class="text-muted" font-size="11px" text-anchor="end">Yesterday</text>
      <text x="110" y="430" class="text-muted" font-size="12px">Cảm ơn bạn nhiều nha!</text>

      <!-- Conversation Item 4 -->
      <rect x="45" y="465" width="370" height="75" class="card-subtle" />
      <circle cx="80" cy="502" r="20" class="avatar-box" />
      <text x="80" y="507" class="avatar-text">MK</text>
      <text x="110" y="495" class="text-bold">Nguyễn Đoàn Minh Khôi</text>
      <text x="395" y="495" class="text-muted" font-size="11px" text-anchor="end">Sep 26</text>
      <text x="110" y="515" class="text-muted" font-size="12px">Token JWT đã test qua Postman ổn rồi.</text>

      <!-- Empty State Card Annotation -->
      <rect x="55" y="660" width="350" height="70" class="card-subtle" />
      <text x="70" y="682" class="text-section" font-size="11px">💬 Empty Conversation State:</text>
      <text x="70" y="699" class="text-muted" font-size="11px">&quot;Select a student conversation from the list or</text>
      <text x="70" y="715" class="text-muted" font-size="11px">search for peers to start a direct 1-to-1 chat.&quot;</text>
    </g>

    <!-- RIGHT PANEL: Active 1-to-1 Chat Window (X: 440, Y: 105, Width: 960, Height: 740) -->
    <g id="active-chat-panel">
      <rect x="440" y="105" width="960" height="740" class="card" />

      <!-- Active Chat Header -->
      <rect x="440" y="105" width="960" height="65" fill="#1A2438" rx="8" />
      <circle cx="475" cy="137" r="20" class="avatar-box" />
      <text x="475" y="142" class="avatar-text">NB</text>
      <circle cx="490" cy="150" r="5" fill="#10B981" stroke="#131B2A" stroke-width="1.5" />

      <text x="510" y="132" class="text-title" font-size="16px">Nguyễn Văn B</text>
      <text x="510" y="150" class="text-muted" font-size="12px">🟢 Online   •   Student - K22 CNTT   •   HCMUTE</text>

      <!-- Header Action -->
      <rect x="1270" y="122" width="110" height="32" class="btn-secondary" />
      <text x="1325" y="142" class="btn-secondary-text" font-size="12px">View Profile</text>
      <line x1="440" y1="170" x2="1400" y2="170" stroke="#233148" />

      <!-- Message History Container -->
      <!-- Date Divider -->
      <line x1="460" y1="205" x2="840" y2="205" stroke="#233148" />
      <text x="920" y="209" class="text-muted" font-size="12px" text-anchor="middle">Today, September 28, 2026</text>
      <line x1="1000" y1="205" x2="1380" y2="205" stroke="#233148" />

      <!-- Incoming Message 1 -->
      <rect x="470" y="230" width="460" height="50" class="btn-secondary" rx="10" />
      <text x="488" y="252" class="text-body" font-size="13px">Chào Quân, phần wireframe cho báo cáo Tuần 1 nhóm mình đã xong chưa?</text>
      <text x="488" y="270" class="text-small">10:15 AM</text>

      <!-- Outgoing Message 1 -->
      <rect x="910" y="295" width="470" height="55" class="btn-primary" rx="10" />
      <text x="928" y="318" class="text-body" font-size="13px" fill="#FFFFFF">Chào bạn, mình đang hoàn thiện bộ 10 SVG wireframe theo đúng chuẩn</text>
      <text x="928" y="336" class="text-body" font-size="13px" fill="#FFFFFF">quy định của đề tài AloUTE rồi nhé.</text>
      <text x="1360" y="342" class="text-small" fill="#93C5FD" text-anchor="end">10:18 AM  ✓✓</text>

      <!-- Incoming Message 2 -->
      <rect x="470" y="365" width="480" height="60" class="btn-secondary" rx="10" />
      <text x="488" y="388" class="text-body" font-size="13px">Tuyệt vời, nhớ bao gồm đủ 10 màn hình: Login, Register, Feed, Profile,</text>
      <text x="488" y="406" class="text-body" font-size="13px">Create Post, Detail, Search, Community, Messaging và Notification nhé.</text>
      <text x="488" y="420" class="text-small">10:22 AM</text>

      <!-- Outgoing Message 2 -->
      <rect x="910" y="440" width="470" height="50" class="btn-primary" rx="10" />
      <text x="928" y="463" class="text-body" font-size="13px" fill="#FFFFFF">Đúng rồi, đầy đủ cả 10 file SVG chuẩn XML và responsive annotation luôn.</text>
      <text x="1360" y="482" class="text-small" fill="#93C5FD" text-anchor="end">10:24 AM  ✓✓</text>

      <!-- Scope Callout Banner Inside Chat -->
      <rect x="470" y="670" width="900" height="42" class="alert-info" />
      <text x="485" y="695" class="alert-info-text">💬 1-to-1 Chat Boundary: Out of scope: Voice/Video calls, Group channels, Bots, Discord server structure.</text>

      <!-- Message Composer Bar -->
      <rect x="440" y="775" width="960" height="70" fill="#111827" rx="8" />
      <line x1="440" y1="775" x2="1400" y2="775" stroke="#233148" />

      <rect x="460" y="790" width="40" height="40" class="btn-secondary" />
      <text x="480" y="815" class="btn-secondary-text" font-size="18px">📎</text>

      <rect x="515" y="790" width="765" height="40" class="input-box" />
      <text x="535" y="815" class="input-placeholder">Type a message to Nguyễn Văn B... (Press Enter to Send)</text>

      <rect x="1295" y="790" width="85" height="40" class="btn-primary" />
      <text x="1337" y="815" class="btn-primary-text" font-size="13px">Send ➤</text>
    </g>

  <!-- Bottom Responsive & Evidence Ribbon -->
  <rect x="0" y="865" width="1440" height="35" class="footer-bar" />
  <text x="24" y="887" class="footer-text">Responsive Layout: Desktop: 2 Columns (Conversation List 380px | Chat 960px) • Tablet + Mobile: Single Column Active Chat / Back to List</text>
  <text x="1416" y="887" class="footer-text" text-anchor="end">Week 1 Wireframe Specification  •  Modern University Social Network  •  Dark Theme Mockup</text>
</svg>