<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .meta-bar { fill: #030712; }
      .meta-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #F8FAFC; font-weight: 600; }
      .meta-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #64748B; }
      .nav-bg { fill: #111827; stroke: #1F2937; stroke-width: 1; }
      .brand-title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 800; fill: #3B82F6; }
      .card { fill: #131B2A; stroke: #233148; stroke-width: 1.5; rx: 8px; }
      .card-subtle { fill: #0F172A; stroke: #1E293B; stroke-width: 1; rx: 6px; }
      .card-hover { fill: #1A2438; stroke: #2A3A55; stroke-width: 1; rx: 6px; }
      .card-active { fill: #172554; stroke: #2563EB; stroke-width: 1.5; rx: 6px; }
      .text-title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #F8FAFC; }
      .text-section { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: #E2E8F0; }
      .text-body { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 400; fill: #CBD5E1; }
      .text-bold { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #F8FAFC; }
      .text-muted { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 400; fill: #94A3B8; }
      .text-small { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 400; fill: #64748B; }
      .btn-primary { fill: #2563EB; stroke: #1D4ED8; stroke-width: 1; rx: 6px; }
      .btn-primary-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #FFFFFF; text-anchor: middle; }
      .btn-secondary { fill: #1E293B; stroke: #334155; stroke-width: 1; rx: 6px; }
      .btn-secondary-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #CBD5E1; text-anchor: middle; }
      .btn-accent { fill: #3B82F6; stroke: #2563EB; stroke-width: 1; rx: 6px; }
      .btn-accent-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #FFFFFF; text-anchor: middle; }
      .btn-danger { fill: #450A0A; stroke: #991B1B; stroke-width: 1; rx: 6px; }
      .btn-danger-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #FCA5A5; text-anchor: middle; }
      .badge-wire { fill: #1E293B; stroke: #334155; stroke-width: 1; rx: 4px; }
      .badge-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #94A3B8; text-anchor: middle; }
      .badge-role { fill: #1E3A8A; stroke: #3B82F6; stroke-width: 1; rx: 4px; }
      .badge-role-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #93C5FD; text-anchor: middle; }
      .input-box { fill: #0B0F19; stroke: #334155; stroke-width: 1.5; rx: 6px; }
      .input-bg { fill: #0F172A; stroke: #1E293B; stroke-width: 1; rx: 6px; }
      .input-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #F1F5F9; }
      .input-placeholder { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #64748B; }
      .avatar-box { fill: #1E293B; stroke: #475569; stroke-width: 1.5; }
      .avatar-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #E2E8F0; text-anchor: middle; }
      .media-ph { fill: #0F172A; stroke: #334155; stroke-width: 1.5; stroke-dasharray: 4,4; rx: 6px; }
      .media-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #94A3B8; text-anchor: middle; }
      .alert-error { fill: #2D1214; stroke: #7F1D1D; stroke-width: 1.5; rx: 6px; }
      .alert-error-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 500; fill: #FCA5A5; }
      .alert-info { fill: #0C1E3A; stroke: #1E40AF; stroke-width: 1.5; rx: 6px; }
      .alert-info-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 500; fill: #93C5FD; }
      .footer-bar { fill: #030712; stroke: #1F2937; stroke-width: 1; }
      .footer-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 500; fill: #64748B; }
    </style>
  </defs>

  <rect x="0" y="0" width="1440" height="900" class="bg" />

  <!-- Top Metadata Bar -->
  <rect x="0" y="0" width="1440" height="38" class="meta-bar" />
  <text x="24" y="24" class="meta-text">AloUTE WIREFRAME [02-register] — USER REGISTRATION</text>
  <text x="1416" y="24" class="meta-sub" text-anchor="end">Owner: Phạm Minh Quân  •  Week 1 UI Design Evidence  •  Dark University Theme  •  1440×900</text>


    <!-- Guest Layout: Centered Register Card (X: 440, Y: 85, Width: 560, Height: 755) -->
    <g id="register-container">
      <rect x="440" y="85" width="560" height="755" class="card" />

      <!-- Branding Header -->
      <rect x="440" y="85" width="560" height="80" fill="#172554" rx="8" />
      <text x="720" y="122" class="brand-title" font-size="26px" text-anchor="middle">AloUTE</text>
      <text x="720" y="145" class="text-muted" font-size="13px" text-anchor="middle">Create Your University Account  •  HCMUTE Community</text>

      <!-- Form Title -->
      <text x="475" y="195" class="text-title" font-size="17px">Register New Student / Faculty Account</text>
      <text x="475" y="214" class="text-muted">Fill in your information to join student discussions and course groups.</text>

      <!-- Validation Error Box -->
      <rect x="475" y="228" width="490" height="44" class="alert-error" />
      <text x="490" y="246" class="alert-error-text" font-weight="700">⚠️ Registration Notice</text>
      <text x="490" y="262" class="alert-error-text">Email must belong to @hcmute.edu.vn or student domain. Passwords must match.</text>

      <!-- Field 1 & 2: Full Name & Username in 2 columns -->
      <text x="475" y="295" class="text-bold">Full Name *</text>
      <rect x="475" y="303" width="235" height="38" class="input-box" />
      <text x="487" y="327" class="input-text">Phạm Minh Quân</text>

      <text x="730" y="295" class="text-bold">Username *</text>
      <rect x="730" y="303" width="235" height="38" class="input-box" />
      <text x="742" y="327" class="input-text">quan_pm</text>

      <!-- Field 3: Email -->
      <text x="475" y="365" class="text-bold">Student / Institutional Email *</text>
      <rect x="475" y="373" width="490" height="38" class="input-box" />
      <text x="487" y="397" class="input-text">quan.pm@student.hcmute.edu.vn</text>

      <!-- Field 4: Password -->
      <text x="475" y="435" class="text-bold">Password *</text>
      <rect x="475" y="443" width="490" height="38" class="input-box" />
      <text x="487" y="467" class="input-text">••••••••••••</text>
      <text x="475" y="496" class="text-small">Must be at least 8 characters with at least one letter and one number.</text>

      <!-- Field 5: Confirm Password -->
      <text x="475" y="525" class="text-bold">Confirm Password *</text>
      <rect x="475" y="533" width="490" height="38" class="input-box" />
      <text x="487" y="557" class="input-text">••••••••••••</text>

      <!-- Checkbox Terms -->
      <rect x="475" y="590" width="16" height="16" class="input-box" rx="3" />
      <polyline points="478,598 482,603 488,593" fill="none" stroke="#3B82F6" stroke-width="2"/>
      <text x="502" y="603" class="text-body" font-size="12px">I agree to the AloUTE Community Guidelines &amp; University Code of Conduct.</text>

      <!-- Register Button -->
      <rect x="475" y="625" width="490" height="44" class="btn-primary" />
      <text x="720" y="652" class="btn-primary-text" font-size="15px">Create Account / Register</text>

      <!-- Divider -->
      <line x1="475" y1="690" x2="690" y2="690" stroke="#233148" />
      <text x="720" y="694" class="text-muted" font-size="12px" text-anchor="middle">or</text>
      <line x1="750" y1="690" x2="965" y2="690" stroke="#233148" />

      <!-- Back to Login Link -->
      <rect x="475" y="710" width="490" height="40" class="btn-secondary" />
      <text x="720" y="735" class="btn-secondary-text" font-size="13px">Already have an account? Log In here</text>

      <!-- Side Annotations (X: 1030, Y: 85, Width: 360) -->
      <rect x="1030" y="85" width="360" height="380" class="card" />
      <text x="1050" y="115" class="text-section">Wireframe Annotations: Register</text>
      <line x1="1050" y1="127" x2="1370" y2="127" stroke="#233148" />

      <text x="1050" y="152" class="text-bold">Screen ID:</text>
      <text x="1130" y="152" class="text-body">WF-02 (Registration Flow)</text>

      <text x="1050" y="176" class="text-bold">Route Target:</text>
      <text x="1150" y="176" class="text-body">/auth/register → /auth/login</text>

      <text x="1050" y="202" class="text-bold">Required Fields:</text>
      <text x="1050" y="222" class="text-muted">• Full Name (Display name on profile)</text>
      <text x="1050" y="240" class="text-muted">• Username (Unique slug @handle)</text>
      <text x="1050" y="258" class="text-muted">• Institutional Email (Unique, format verified)</text>
      <text x="1050" y="276" class="text-muted">• Password &amp; Confirm Password match</text>
      <text x="1050" y="294" class="text-muted">• Agreement checkbox to Code of Conduct</text>
      <text x="1050" y="312" class="text-muted">• Link back to Login screen</text>

      <rect x="1050" y="335" width="320" height="110" class="card-subtle" />
      <text x="1062" y="355" class="text-bold" font-size="12px">Validation &amp; Error Handling:</text>
      <text x="1062" y="375" class="text-muted" font-size="11px">• Duplicate username/email inline banner</text>
      <text x="1062" y="392" class="text-muted" font-size="11px">• Password mismatch instant feedback</text>
      <text x="1062" y="409" class="text-muted" font-size="11px">• Successful submission redirects to login</text>
      <text x="1062" y="426" class="text-muted" font-size="11px">• Mobile: Stacks columns vertically (100% width)</text>
    </g>

  <!-- Bottom Responsive & Evidence Ribbon -->
  <rect x="0" y="865" width="1440" height="35" class="footer-bar" />
  <text x="24" y="887" class="footer-text">Responsive Layout: Centered Single Column Card (Desktop: 560px | Tablet: 480px | Mobile: 100% full width)</text>
  <text x="1416" y="887" class="footer-text" text-anchor="end">Week 1 Wireframe Specification  •  Modern University Social Network  •  Dark Theme Mockup</text>
</svg>