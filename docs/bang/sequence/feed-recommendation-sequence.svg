<line class="arrow" x1="785.0" y1="644" x2="785.0" y2="644"/>
<text class="m" x="785.0" y="637" text-anchor="middle">12. Chấm điểm đa chiều: Score = 0.25*R + 0.35*S + 0.25*T + 0.15*E</text>
<line class="arrow" x1="785.0" y1="688" x2="785.0" y2="688"/>
