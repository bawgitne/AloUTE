services:
  mysql:
    image: mysql:8.0
    container_name: aloute-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aloutedb}
      MYSQL_USER: ${MYSQL_USER:-aloute_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set and non-empty}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set and non-empty}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set and non-empty}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aloute-internal

  app:
    build:
      context: ../../
      dockerfile: Dockerfile
    container_name: aloute-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-aloutedb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-aloute_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set and non-empty}
      ALOUTE_JWT_SECRET: ${ALOUTE_JWT_SECRET:?ALOUTE_JWT_SECRET must be set and non-empty}
      ALOUTE_JWT_EXPIRATION_SECONDS: ${ALOUTE_JWT_EXPIRATION_SECONDS:-86400}
      ALOUTE_REGISTRATION_OTP_SECRET: ${ALOUTE_REGISTRATION_OTP_SECRET:?ALOUTE_REGISTRATION_OTP_SECRET must be set and non-empty}
      ALOUTE_APP_BASE_URL: ${ALOUTE_APP_BASE_URL:?ALOUTE_APP_BASE_URL must be set and non-empty}
      ALOUTE_MAIL_HOST: ${ALOUTE_MAIL_HOST:?ALOUTE_MAIL_HOST must be set and non-empty}
      ALOUTE_MAIL_PORT: ${ALOUTE_MAIL_PORT:-587}
      ALOUTE_MAIL_USERNAME: ${ALOUTE_MAIL_USERNAME:?ALOUTE_MAIL_USERNAME must be set and non-empty}
      ALOUTE_MAIL_PASSWORD: ${ALOUTE_MAIL_PASSWORD:?ALOUTE_MAIL_PASSWORD must be set and non-empty}
      ALOUTE_MAIL_FROM: ${ALOUTE_MAIL_FROM:-noreply@${ALOUTE_DOMAIN:-aloute.edu.vn}}
    expose:
      - "8080"
    networks:
      - aloute-internal

  nginx:
    image: nginx:alpine
    container_name: aloute-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      ALOUTE_DOMAIN: ${ALOUTE_DOMAIN:?ALOUTE_DOMAIN must be set and non-empty}
    entrypoint: ["/bin/sh", "/deploy/scripts/render-nginx.sh"]
    command: ["nginx", "-g", "daemon off;"]
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d/aloute.conf.template:/etc/nginx/templates/aloute.conf.template:ro
      - ../scripts/render-nginx.sh:/deploy/scripts/render-nginx.sh:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - aloute-internal

volumes:
  mysql_data:

networks:
  aloute-internal:
    driver: bridge
