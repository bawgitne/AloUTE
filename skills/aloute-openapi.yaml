openapi: 3.1.0

info:
  title: ALOUTE API
  version: 0.1.0
  description: |
    Canonical HTTP API contract for ALOUTE.

    Ownership:
    - Global response, pagination, HTTP and error conventions come from ALOUTE_SYSTEM_ARCHITECTURE.md.
    - Business behavior and permissions come from ALOUTE_DOMAIN_SYSTEM.md.
    - Authentication/authorization enforcement comes from SPRING_SECURITY_CONVENTION.md.
    - Spring Boot implementation details come from ALOUTE_SPRING_BOOT_BACKEND_CONVENTION.md.
    - WebSocket realtime events are intentionally not described by OpenAPI.

    Current domain GAPs are intentionally not modeled as completed APIs:
    - private follow-request approval lifecycle
    - private community join-request approval lifecycle
    - advanced community moderation
    - group-conversation ownership/admin lifecycle
    - refresh-session lifecycle (access token only; revocation via `authVersion`)
    - notification preferences
    - account suspension / feature restriction (`account_suspensions`, `account_feature_restrictions` are P2)

    Implementation status legend (`x-implementation-status`):
    - `implemented` — controller/service exist on master and are covered by the contract below.
    - `stub` — route exists but returns placeholder data or ignores path semantics.
    - `contract-only` — contract is authoritative, the route is not implemented yet; clients must expect 404.
    Operations without the extension are `implemented`.

    Registration email OTP and password recovery are implemented
    (`verify-registration-otp`, `resend-registration-otp`, `forgot-password`, `reset-password`)
    and are no longer listed as gaps.

servers:
  - url: /
    description: Same-origin ALOUTE server

tags:
  - name: Auth
  - name: Users
  - name: Social
  - name: Posts
  - name: Media
  - name: Topics
  - name: Polls
  - name: Communities
  - name: Feeds
  - name: Conversations
  - name: Notifications
  - name: Reports
  - name: Admin

paths:

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register account
      description: |
        Creates the account and registration OTP, commits the transaction, then attempts email delivery before returning.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/auth/verify-registration-otp:
    post:
      tags: [Auth]
      summary: Verify registration 6-digit numeric OTP
      description: |
        Atomically verifies the keyed HMAC OTP and activates the user account (isVerified = true, verificationRequired = false),
        consuming and deleting the registration OTP record.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRegistrationOtpRequest'
      responses:
        '200':
          description: Registration OTP verified and account activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/auth/resend-registration-otp:
    post:
      tags: [Auth]
      summary: Resend registration OTP
      description: |
        Generates a replacement 6-digit numeric registration OTP with rate limiting (60-second cooldown).
        Email delivery is attempted after transaction commit and finishes before the response is returned.
        Returns generic success silently for nonexistent, inactive, already verified, or legacy accounts to prevent user enumeration.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendRegistrationOtpRequest'
      responses:
        '200':
          description: Registration OTP dispatched or generic success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login
      description: |
        On success the backend authenticates the user and sets the JWT access credential
        in an HttpOnly cookie named `aloute_access_token`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              description: HttpOnly authentication cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/auth/2fa/verify-login:
    post:
      tags: [Auth]
      summary: Verify Two-Factor Authentication Login
      description: |
        Validates the 2FA challenge code (6-digit TOTP from Google Authenticator,
        Email fallback OTP, or 8-character single-use emergency backup code)
        using the temporary twoFactorTicket issued in the first login step.
        On success, issues the official authenticated JWT access credential.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [twoFactorTicket, code]
              properties:
                twoFactorTicket:
                  type: string
                code:
                  type: string
                isBackupCode:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Two-factor verification successful, JWT issued
          headers:
            Set-Cookie:
              description: HttpOnly authentication cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/auth/2fa/send-email-fallback:
    post:
      tags: [Auth]
      summary: Send Two-Factor Fallback OTP via Email
      description: |
        Dispatches a 6-digit numeric OTP to the user's verified university email
        as a fallback when they do not have access to their Authenticator app.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [twoFactorTicket]
              properties:
                twoFactorTicket:
                  type: string
      responses:
        '200':
          description: OTP dispatched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMessage'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset link
      description: |
        Generates a secure single-use expiring reset token and sends a recovery email
        with a fragment-based link. Returns generic confirmation regardless of email existence.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Generic instructions confirmation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseNull'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

  /api/auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password using secure token
      description: |
        Atomically replaces password hash, increments account authVersion (invalidating all active JWTs),
        and consumes the reset token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseNull'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Logout current user
      responses:
        '204':
          description: Logged out successfully. The current JWT session is durably revoked (stored token_hash is SHA-256 digest of verified decoded signature bytes in revoked_tokens table, cryptographically verified before lookup/writes), associated active STOMP WebSocket transports closed after transaction commit, and authentication cookie cleared.
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/users/{userId}:
    get:
      tags: [Users]
      summary: Get user profile
      security: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/users/by-username/{username}:
    get:
      tags: [Users]
      summary: Get user profile by handle/username
      security: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/users/me/profile:
    get:
      tags: [Users]
      summary: Get current user profile
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    patch:
      tags: [Users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
    put:
      tags: [Users]
      summary: Update current user profile (PUT alias)
      description: Same handler as `PATCH`; registered for clients that can only issue PUT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/users/profile:
    get:
      tags: [Users]
      summary: Get current user profile (path alias)
      description: |
        Short alias of `/api/users/me/profile` served by the same controller methods
        (`@GetMapping({"/me/profile", "/profile"})`). Both paths behave identically.
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/users/me/password:
    post:
      tags: [Users]
      summary: Change password for current user
      description: |
        Verifies current password with BCrypt, updates password_hash, increments authVersion,
        and sets a refreshed access token cookie on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/users/me/deactivate:
    post:
      tags: [Users]
      summary: Deactivate the current user's own account
      description: |
        Confirms the caller's password, sets the account inactive, increments authVersion
        (revoking every outstanding access token) and clears the auth cookie. A user whose
        account is later reactivated must sign in again.

        Safety invariant: the last active SYSTEM_ADMIN cannot self-deactivate — the request
        is refused with 409 `USER_LAST_ADMIN_PROTECTED` and no state is changed (no active
        flag change, no authVersion bump). Ordinary users are unaffected by this guard.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 1
                  description: Current password, required to confirm the action
      responses:
        '200':
          description: Account deactivated; auth cookie cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMessage'
        '400':
          description: Wrong confirmation password (`INVALID_PASSWORD`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: Last active SYSTEM_ADMIN cannot be deactivated (`USER_LAST_ADMIN_PROTECTED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/users/{userId}/posts:
    get:
      tags: [Users, Posts]
      summary: List posts by user
      security: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Visible posts by user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostPageEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/users/{userId}/followers:
    get:
      tags: [Users, Social]
      summary: List followers
      security: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Followers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPageEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/users/{userId}/following:
    get:
      tags: [Users, Social]
      summary: List users followed by a user
      security: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Following list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPageEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/social/follows/{userId}:
    put:
      tags: [Social]
      summary: Follow a user
      description: |
        Creates the current user's follow relationship to the target user.
        Private-account follow-request approval is not modeled yet.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Follow relationship active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialRelationEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Social]
      summary: Unfollow a user
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Follow relationship removed
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/social/relations/{userId}:
    get:
      tags: [Social]
      summary: Get social relationship status between current user and target user
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Relationship status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRelationStatusEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/social/blocks/{userId}:
    put:
      tags: [Social]
      summary: Block a user
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Block relationship active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialRelationEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Social]
      summary: Unblock a user
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Block removed
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/social/mutes/{userId}:
    put:
      tags: [Social]
      summary: Mute a user
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Mute active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialRelationEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Social]
      summary: Unmute a user
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Mute removed
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/social/restrictions/{userId}:
    put:
      tags: [Social]
      summary: Restrict a user
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Restriction active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialRelationEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Social]
      summary: Remove user restriction
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Restriction removed
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/posts:
    get:
      tags: [Posts]
      summary: List public posts
      description: |
        Public visibility-scoped listing. When `q` is present it delegates to
        `PostService.searchPosts` with the same visibility specification, so private
        community posts never leak. Replies and quotes are excluded from the top-level list.
      security: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Visible posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostPageEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Posts]
      summary: Create post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '201':
          description: Post created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/posts/bookmarks:
    get:
      tags: [Posts]
      summary: List posts bookmarked by current user
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Bookmarked posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostPageEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/posts/{postId}:
    get:
      tags: [Posts]
      summary: Get post
      security: []
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '200':
          description: Visible post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Posts]
      summary: Edit own post
      parameters:
        - $ref: '#/components/parameters/PostId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePostRequest'
      responses:
        '200':
          description: Updated post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Posts]
      summary: Delete own post
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '204':
          description: Post deleted
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/posts/{postId}/replies:
    get:
      tags: [Posts]
      summary: List replies
      security: []
      parameters:
        - $ref: '#/components/parameters/PostId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Visible replies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostPageEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Posts]
      summary: Reply to post
      parameters:
        - $ref: '#/components/parameters/PostId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReplyRequest'
      responses:
        '201':
          description: Reply created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/posts/{postId}/quotes:
    post:
      tags: [Posts]
      summary: Quote a post
      parameters:
        - $ref: '#/components/parameters/PostId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuoteRequest'
      responses:
        '201':
          description: Quote post created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/posts/{postId}/likes/me:
    put:
      tags: [Posts]
      summary: Like post
