components:

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: aloute_access_token
      description: HttpOnly JWT access credential.

  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0

    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    Sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        default: createdAt,desc

    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

    PostId:
      name: postId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

    MediaId:
      name: mediaId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

    TopicId:
      name: topicId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

    PollId:
      name: pollId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

    CommunityId:
      name: communityId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

    FeedId:
      name: feedId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

  responses:
    RateLimitExceeded:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    BadRequest:
      description: Malformed or invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    Unauthenticated:
      description: Authentication required or credential invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    Forbidden:
      description: Authenticated but operation is not permitted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    Conflict:
      description: Request conflicts with current resource state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    ValidationError:
      description: Semantic or field validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:

    ApiResponseNull:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          example: true
        data:
          nullable: true
          example: null

    ApiResponseMessage:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [message]
          properties:
            message:
              type: string
              example: "Thao tác thành công."

    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          examples: [POST_NOT_FOUND]
        message:
          type: string
        fieldErrors:
          type: object
          nullable: true
          additionalProperties:
            type: array
            items:
              type: string

    ErrorEnvelope:
      type: object
      required: [success, error, traceId]
      properties:
        success:
          type: boolean
          const: false
        error:
          $ref: '#/components/schemas/ApiError'
        traceId:
          type: string

    PageMeta:
      type: object
      required: [page, size, totalElements, totalPages, hasNext, hasPrevious]
      properties:
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        hasNext:
          type: boolean
        hasPrevious:
          type: boolean

    UserSummary:
      type: object
      required: [id, username, displayName, isVerified]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
          format: uri
          nullable: true
        isVerified:
          type: boolean

    UserResponse:
      type: object
      required: [id, username, email, isVerified, isPrivate, isActive]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
          format: email
        isVerified:
          type: boolean
        isPrivate:
          type: boolean
        isActive:
          type: boolean
        role:
          type: string
          enum: [USER, SYSTEM_ADMIN]

    ProfileResponse:
      type: object
      required:
        - id
        - username
        - displayName
        - isVerified
        - isPrivate
        - followersCount
        - followingCount
        - postsCount
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
        bio:
          type: string
          nullable: true
        avatarUrl:
          type: string
          format: uri
          nullable: true
        coverUrl:
          type: string
          format: uri
          nullable: true
        website:
          type: string
          format: uri
          nullable: true
        isVerified:
          type: boolean
        isPrivate:
          type: boolean
        followersCount:
          type: integer
          format: int64
          minimum: 0
        followingCount:
          type: integer
          format: int64
          minimum: 0
        postsCount:
          type: integer
          format: int64
          minimum: 0
        capabilities:
          $ref: '#/components/schemas/ProfileCapabilities'

    ProfileCapabilities:
      type: object
      properties:
        canFollow:
          type: boolean
        canMessage:
          type: boolean
        canBlock:
          type: boolean
        canEdit:
          type: boolean

    PostVisibility:
      type: string
      enum: [PUBLIC, FOLLOWERS, MENTIONED]

    MediaType:
      type: string
      enum: [IMAGE, VIDEO, GIF]

    MediaPurpose:
      type: string
      enum:
        - POST
        - MESSAGE
        - USER_AVATAR
        - USER_COVER
        - COMMUNITY_AVATAR
        - COMMUNITY_COVER

    MediaResponse:
      type: object
      required: [id, type, url]
      properties:
        id:
          type: integer
          format: int64
        type:
          $ref: '#/components/schemas/MediaType'
        url:
          type: string
          format: uri
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        durationSeconds:
          type: number
          format: double
          nullable: true
        position:
          type: integer
          nullable: true

    PostCapabilities:
      type: object
      required: [canEdit, canDelete, canReply, canQuote]
      properties:
        canEdit:
          type: boolean
        canDelete:
          type: boolean
        canReply:
          type: boolean
        canQuote:
          type: boolean
        canApprove:
          type: boolean
          description: Viewer may approve/reject this submission (community owner/ADMIN)
        canRemove:
          type: boolean
          description: Viewer may soft-remove this published community post (community owner/ADMIN)

    PostModerationStatus:
      type: string
      description: Null (or absent) reads as APPROVED everywhere
      enum: [PENDING, APPROVED, REJECTED]

    CommunitySummaryResponse:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
        avatarUrl:
          type: string
          nullable: true

    CommunityPostDecisionRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
          nullable: true

    PostViewerState:
      type: object
      properties:
        liked:
          type: boolean
        bookmarked:
          type: boolean
        reposted:
          type: boolean

    PostResponse:
      type: object
      required:
        - id
        - author
        - content
        - visibility
        - allowReply
        - allowQuote
        - likeCount
        - replyCount
        - repostCount
        - quoteCount
        - viewCount
        - createdAt
      properties:
        id:
          type: integer
          format: int64
        author:
          $ref: '#/components/schemas/UserSummary'
        content:
          type: string
        parentPostId:
          type: integer
          format: int64
          nullable: true
        quotedPostId:
          type: integer
          format: int64
          nullable: true
        communityId:
          type: integer
          format: int64
          nullable: true
        visibility:
          $ref: '#/components/schemas/PostVisibility'
        allowReply:
          type: boolean
        allowQuote:
          type: boolean
        media:
          type: array
          items:
            $ref: '#/components/schemas/MediaResponse'
        topics:
          type: array
          items:
            $ref: '#/components/schemas/TopicResponse'
        poll:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/PollResponse'
        likeCount:
          type: integer
          format: int64
          minimum: 0
        replyCount:
          type: integer
          format: int64
          minimum: 0
        repostCount:
          type: integer
          format: int64
          minimum: 0
        quoteCount:
          type: integer
          format: int64
          minimum: 0
        viewCount:
          type: integer
          format: int64
          minimum: 0
        viewerState:
          $ref: '#/components/schemas/PostViewerState'
        capabilities:
          $ref: '#/components/schemas/PostCapabilities'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
        community:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CommunitySummaryResponse'
        moderationStatus:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/PostModerationStatus'
        moderationReason:
          type: string
          nullable: true
          description: Rejection reason; only returned to the submission author and community moderators

    TopicResponse:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
          nullable: true

    PollOptionResponse:
      type: object
      required: [id, text, voteCount]
      properties:
        id:
          type: integer
          format: int64
        text:
          type: string
        voteCount:
          type: integer
          format: int64
          minimum: 0
        selectedByCurrentUser:
          type: boolean
          nullable: true

    PollResponse:
      type: object
      required: [id, allowMultiple, options]
      properties:
        id:
          type: integer
          format: int64
        question:
          type: string
          nullable: true
        allowMultiple:
          type: boolean
        closesAt:
          type: string
          format: date-time
          nullable: true
        options:
          type: array
          items:
            $ref: '#/components/schemas/PollOptionResponse'

    CommunityRole:
      type: string
      enum: [MEMBER, MODERATOR, ADMIN]

    CommunityResponse:
      type: object
      required: [id, ownerId, name, slug, isPrivate, memberCount, postCount]
      properties:
        id:
          type: integer
          format: int64
        ownerId:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        avatarUrl:
          type: string
          format: uri
          nullable: true
        coverUrl:
          type: string
          format: uri
          nullable: true
        isPrivate:
          type: boolean
        memberCount:
          type: integer
          format: int64
          minimum: 0
        postCount:
          type: integer
          format: int64
          minimum: 0
        currentUserRole:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CommunityRole'
        isOwner:
          type: boolean
          nullable: true
        requirePostApproval:
          type: boolean
          description: Owner-only setting; ordinary member submissions enter PENDING when true
        canManage:
          type: boolean
          description: True when the viewer is the community owner or an ADMIN-role member
        pendingPostCount:
          type: integer
          format: int64
          minimum: 0
          description: Pending submissions; only non-zero for viewers with canManage

    CommunityMembershipResponse:
      type: object
      required: [communityId, user, role, joinedAt]
      properties:
        communityId:
          type: integer
          format: int64
        user:
          $ref: '#/components/schemas/UserSummary'
        role:
          $ref: '#/components/schemas/CommunityRole'
        joinedAt:
          type: string
          format: date-time

    FeedResponse:
      type: object
      required: [id, name, isPublic]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
          nullable: true
        isPublic:
          type: boolean
        topicIds:
          type: array
          items:
            type: integer
            format: int64
        userIds:
          type: array
          items:
            type: integer
            format: int64

    ConversationType:
      type: string
      enum: [DIRECT, GROUP]

    ConversationResponse:
      type: object
      required: [id, type, members, createdAt]
      properties:
        id:
          type: integer
          format: int64
        type:
          $ref: '#/components/schemas/ConversationType'
        name:
          type: string
          nullable: true
        avatarUrl:
          type: string
          format: uri
          nullable: true
        members:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
        createdAt:
          type: string
          format: date-time

    MessageResponse:
      type: object
      required: [id, conversationId, sender, content, createdAt]
      properties:
        id:
          type: integer
          format: int64
        conversationId:
          type: integer
          format: int64
        sender:
          $ref: '#/components/schemas/UserSummary'
        replyToMessageId:
          type: integer
          format: int64
          nullable: true
        content:
          type: string
        media:
          type: array
          items:
            $ref: '#/components/schemas/MediaResponse'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true

    NotificationType:
      type: string
      description: |
        Giá trị emit thực tế bởi NotificationServiceImpl (string, không phải enum Java).
        Kiểu lọc theo tab ở GET /api/notifications dùng giá trị rút gọn: ALL, LIKE, REPLY,
        MENTION, FOLLOW.
      enum: [POST_LIKE, REPLY_LIKE, POST_REPLY, REPLY_REPLY, POST_QUOTE, POST_REPOST,
             POST_MENTION, REPLY_MENTION, FOLLOW, FRIEND_REQUEST, FRIEND_ACCEPT]

    NotificationResponse:
      type: object
      description: |
        Khớp `com.aloute.dto.response.NotificationResponse` (Lombok `isRead` getter → Jackson
        serialize thành property `read`; asserted bởi ThymeleafViewRenderIntegrationTest).
        Field `targetType`/`targetId` thay cho postId/messageId/communityId tách rời.
      required: [id, recipientId, actorId, type, targetType, targetId, contentPreview, read, createdAt]
      properties:
        id:
          type: integer
          format: int64
        recipientId:
          type: integer
          format: int64
        actorId:
          type: integer
          format: int64
          nullable: true
        actor:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/UserSummary'
        type:
          $ref: '#/components/schemas/NotificationType'
        targetType:
          type: string
          nullable: true
        targetId:
          type: integer
          format: int64
          nullable: true
        contentPreview:
          type: string
          nullable: true
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time

    ReportReason:
      type: string
      enum: [SPAM, HARASSMENT, HATE, MISINFORMATION, VIOLENCE, OTHER]

    ReportStatus:
      type: string
      enum: [PENDING, REVIEWED, REJECTED, RESOLVED]

    ReportResponse:
      type: object
      required: [id, reason, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
        reportedUserId:
          type: integer
          format: int64
          nullable: true
        reportedPostId:
          type: integer
          format: int64
          nullable: true
        reason:
          $ref: '#/components/schemas/ReportReason'
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/ReportStatus'
        createdAt:
          type: string
          format: date-time

    SocialRelationResponse:
      type: object
      required: [targetUserId, active]
      properties:
        targetUserId:
          type: integer
          format: int64
        active:
          type: boolean

    UserRelationStatusResponse:
      type: object
      required: [targetUserId, following, blocked, muted, restricted]
      properties:
        targetUserId:
          type: integer
          format: int64
        following:
          type: boolean
        blocked:
          type: boolean
        muted:
          type: boolean
        restricted:
          type: boolean

    UserRelationStatusEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/UserRelationStatusResponse'

    PostInteractionResponse:
      type: object
      required: [postId, active]
      properties:
        postId:
          type: integer
          format: int64
        active:
          type: boolean

    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          description: User email address or username
        password:
          type: string

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword, confirmPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
          maxLength: 100
        confirmPassword:
          type: string
          minLength: 8
          maxLength: 100

    ResetPasswordRequest:
      type: object
      required: [token, password, confirmPassword]
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8
          maxLength: 128
        confirmPassword:
          type: string
          minLength: 8
          maxLength: 128

    VerifyRegistrationOtpRequest:
      type: object
      required: [email, otp]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        otp:
          type: string
          pattern: '^[0-9]{6}$'
          example: '123456'

    ResendRegistrationOtpRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254

    UpdateProfileRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 100
        bio:
          type: string
          maxLength: 500
          nullable: true
        website:
          type: string
          format: uri
          nullable: true
        avatarMediaId:
          type: integer
          format: int64
          nullable: true
        isPrivate:
          type: boolean

    PollCreateInput:
      type: object
      required: [question, options, allowMultiple]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 255
        allowMultiple:
          type: boolean
        durationDays:
          type: integer
          format: int32
          minimum: 1
          maximum: 365
          nullable: true
          description: |
            Optional poll lifetime in days, counted from post creation. When present the
            poll closes automatically after the given number of days; when omitted the
            poll stays open indefinitely.
        options:
          type: array
          minItems: 2
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 200

    CreatePostRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          maxLength: 4000
        visibility:
          $ref: '#/components/schemas/PostVisibility'
        allowReply:
          type: boolean
          default: true
        allowQuote:
          type: boolean
          default: true
        mediaIds:
          type: array
          uniqueItems: true
          items:
            type: integer
            format: int64
        mentionedUserIds:
          type: array
          uniqueItems: true
          items:
            type: integer
            format: int64
        topicIds:
          type: array
          uniqueItems: true
          items:
            type: integer
            format: int64
        poll:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/PollCreateInput'

    UpdatePostRequest:
      type: object
      properties:
        content:
          type: string
        visibility:
          $ref: '#/components/schemas/PostVisibility'
        allowReply:
          type: boolean
        allowQuote:
          type: boolean

    CreateReplyRequest:
      allOf:
        - $ref: '#/components/schemas/CreatePostRequest'

    CreateQuoteRequest:
      allOf:
        - $ref: '#/components/schemas/CreatePostRequest'

    VotePollRequest:
      type: object
      required: [optionIds]
      properties:
        optionIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            format: int64

    CreateCommunityRequest:
      type: object
      required: [name, slug, isPrivate]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 2000
          nullable: true
        isPrivate:
          type: boolean
        avatarMediaId:
          type: integer
          format: int64
          nullable: true
        coverMediaId:
          type: integer
          format: int64
          nullable: true

    UpdateCommunityRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 2000
          nullable: true
        isPrivate:
          type: boolean
        avatarMediaId:
          type: integer
          format: int64
          nullable: true
        coverMediaId:
          type: integer
          format: int64
          nullable: true
        requirePostApproval:
          type: boolean
          nullable: true
          description: Toggling the approval policy is restricted to the community owner

    UpdateCommunityRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/CommunityRole'

    CreateFeedRequest:
      type: object
      required: [name, isPublic]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
          nullable: true
        isPublic:
          type: boolean
        topicIds:
          type: array
          uniqueItems: true
          items:
            type: integer
            format: int64
        userIds:
          type: array
          uniqueItems: true
          items:
            type: integer
            format: int64

    UpdateFeedRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
          nullable: true
        isPublic:
          type: boolean
        topicIds:
          type: array
          uniqueItems: true
          items:
            type: integer
            format: int64
        userIds:
          type: array
          uniqueItems: true
          items:
            type: integer
            format: int64

    CreateConversationRequest:
      type: object
      required: [type, memberIds]
      properties:
        type:
          $ref: '#/components/schemas/ConversationType'
        memberIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            format: int64
        name:
          type: string
          maxLength: 100
          nullable: true
        avatarMediaId:
          type: integer
          format: int64
          nullable: true

    CreateReportRequest:
      type: object
      required: [reason]
      oneOf:
        - required: [reportedUserId]
        - required: [reportedPostId]
      properties:
        reportedUserId:
          type: integer
          format: int64
          nullable: true
        reportedPostId:
          type: integer
          format: int64
          nullable: true
        reason:
          $ref: '#/components/schemas/ReportReason'
        description:
          type: string
          maxLength: 2000
          nullable: true

    RegisterFcmTokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Firebase Cloud Messaging registration token
          maxLength: 500

    UserEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/UserResponse'
        meta:
          type: 'null'

    ProfileEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/ProfileResponse'
        meta:
          type: 'null'

    PostEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/PostResponse'
        meta:
          type: 'null'

    MediaEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/MediaResponse'
        meta:
          type: 'null'

    TopicEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/TopicResponse'
        meta:
          type: 'null'

    PollEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/PollResponse'
        meta:
          type: 'null'

    CommunityEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/CommunityResponse'
        meta:
          type: 'null'

    CommunityMembershipEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/CommunityMembershipResponse'
